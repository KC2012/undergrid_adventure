 if(id==='breach'){dashMode=toolMode=false;if(!canAct(a,2)||!S.grenades){notify('Requires 2 AP and a frag.');return false;}battle.shaped=true;grenadeMode=true;notify('SHAPED FRAG // Click a location. Allies can be hit.');return true;}
 if(!canAct(a,s.cost))return false;if(id==='patch'&&!alive().some(b=>dist(a,b)<180&&(b.hp<b.maxhp||b.burn||b.toxin))){notify('Nearby crew are healthy.');return false;}

function validateAdventure(d){const a=d.adventure;if(a?.run)throw Error('Active jobs cannot be imported.');if(!a||a.version!==1||typeof a.autoNext!=='boolean'||typeof a.fastTurns!=='boolean'||typeof a.hints!=='boolean'||!a.activityWins||!Array.isArray(a.moments)||a.moments.some(m=>typeof m.title!=='string'||typeof m.body!=='string'))throw Error('Invalid adventure state.');for(const [id,n] of Object.entries(a.activityWins))if(!Object.hasOwn(UG.activities,id)||!Number.isInteger(n)||n<0||n>100000)throw Error('Invalid work record.');for(const p of [...d.party,...d.reserve]){if(!Array.isArray(p.skills)||p.skills.length>3||new Set(p.skills).size!==p.skills.length||p.skills.some(id=>!Object.hasOwn(UG.skills,id))||!Number.isInteger(p.abilityPoints)||p.abilityPoints<0||p.abilityPoints>3||!p.calibrations||!Array.isArray(p.quickSlots)||p.quickSlots.length>2||p.quickSlots.some(id=>!d.weapons.includes(id)))throw Error('Invalid ability loadout.');for(const [id,n] of Object.entries(p.calibrations))if(!Object.hasOwn(UG.weapons,id)||!Number.isInteger(n)||n<0||n>3)throw Error('Invalid calibration.');}}

function greaterUpgrade(d){if(!d||!d.world||!Array.isArray(d.party))return d;const old=!d.greater;
 if(old)d.greater={version:1,factions:{wards:0,factors:0},charter:null,relays:[],ending:null,expeditionWins:{},expeditionReturns:{},serial:0,run:null};

 for(const id of [...UG.greaterStoryRooms,...UG.expeditionIds])if(!d.world[id])d.world[id]=emptyWorld(UG.rooms[id]);
 if(old)for(const e of UG.rooms.redoubt.enemies)if(e.dormant)d.world.redoubt.enemies[e.id].hp=0;

function validateGreater(d){const g=d.greater,number=n=>Number.isFinite(n)&&n>=0&&n<=1e7;
 if(!g||g.version!==1||!g.factions||!['wards','factors'].every(k=>Number.isInteger(g.factions[k])&&Math.abs(g.factions[k])<=100)||!Array.isArray(g.relays)||new Set(g.relays).size!==g.relays.length||g.relays.some(k=>!['a','b','c'].includes(k))||!Number.isInteger(g.serial)||g.serial<0||g.serial>1000000||!g.expeditionWins||![null,'commons','bonded'].includes(g.charter)||![null,'commons','bonded','crew'].includes(g.ending))throw Error('Invalid Common Line state.');
 for(const [id,n] of Object.entries({...g.expeditionWins,...g.expeditionReturns}))if(!UG.expeditions[id]||!Number.isInteger(n)||n<0||n>1000000)throw Error('Invalid expedition record.');
 if(g.run){const r=g.run;if(!UG.expeditions[r.family]||!Number.isInteger(r.seed)||r.seed<1||r.seed>1000000||!storyRoomIds().includes(r.origin?.room)||!number(r.origin.x)||!number(r.origin.y)||r.origin.x>UG.rooms[r.origin.room].w||r.origin.y>UG.rooms[r.origin.room].h||typeof r.primary!=='boolean'||typeof r.control!=='boolean'||typeof r.vault!=='boolean'||!r.bag||!['credits','scrap','xp'].every(k=>number(r.bag[k]))||!['ward','mill'].includes(r.route)||!UG.expeditionIds.includes(d.room)||!d.room.startsWith('exp_'+r.family+'_')||r.finished)throw Error('Invalid expedition checkpoint.');}
 else if(UG.expeditionIds.includes(d.room))throw Error('Missing active expedition.');

function campaignAct(){return !S.ending?1:!S.flags.commonPass?2:!S.flags.networkPass?3:!S.flags.heartPass?4:!S.flags.lineComplete?5:6;}
function mainObjective(){const act=campaignAct();if(act===1)return openingObjective();if(act===2){const tasks=[];if(!S.flags.railPass)tasks.push('repair Locomotive 09');if(!S.flags.convoy)tasks.push('deliver its first freight');if(!S.flags.sluice)tasks.push('restore clean water');return 'ACT II / '+(tasks.length?tasks.join(', ')+'. Work boards in Rustmarket.':'Ratify a charter at the Common Line desk, Rustmarket ground concourse.');}
 if(act===3)return S.items.governor?'ACT III / Return the Cold Foundry governor to Ada at Kettle Junction.':'ACT III / Take the high Dead Rail outer freight to Kettle Junction. Ada needs the Cold Foundry governor beyond the Abyss.';

}

function charterPanel(){const ready=S.ending&&S.flags.railPass&&S.flags.convoy&&S.flags.sluice,here=atStory('charter');panel('THE COMMON LINE / ACT II',`<h1>A line worth keeping.</h1><p>The Bell Engine returned a charter for stations beyond the survey. The locomotive can reach them. Someone must guarantee freight, water and safe passage before the wards will sign.</p><p>${S.ending?'✓':'○'} Bell Engine channel<br>${S.flags.railPass?'✓':'○'} Locomotive repaired<br>${S.flags.convoy?'✓':'○'} First freight delivered<br>${S.flags.sluice?'✓':'○'} Clean-water sluice</p><div class="grid"><article class="card"><h3>Common carriage</h3><p>Give the wards a public stake. +2 ward trust, -1 factor trust, two medkits and six salvage. Supports a public conclusion.</p><button data-charter="commons" ${ready&&here&&!S.greater.charter?'':'disabled'}>SIGN FOR THE WARDS</button></article><article class="card"><h3>Bonded freight</h3><p>Let freight factors back the repair. +2 factor trust, -1 ward trust, ¢100 and a supplier discount. Supports a bonded conclusion.</p><button data-charter="bonded" ${ready&&here&&!S.greater.charter?'':'disabled'}>TAKE THE FACTORS’ BOND</button></article></div><p>${S.greater.charter?'Charter signed. The high Dead Rail outer freight is open.':!here?'Sign at Rustmarket’s Common Line desk on the ground concourse.':'Existing work boards carry the required jobs. No extra reputation grind is required.'}</p><button data-action="contracts">WORK BOARD</button>`);}

function greaterInteract(o){if(!o)return false;if(o.type==='expedition')return expeditionInteract(o);if(S.greater.run&&o.type==='door'){
 if(battle&&(battle.phase!=='player'||paths.size))return true;if(battle&&!canAct(selected(),1))return true;if(battle)selected().ap--;travel(o.to,o.sx,o.sy);return true;}

 if(S.items.anikRescued&&!S.items.anikHome){S.items.anikHome=true;S.greater.factions.wards++;gainXP(35);log('Anik came home. Ada fills the seventh cup.');}
 panel('ADA / DISPATCH IS A KIND OF PROMISE',`<h1>Keep the kettle on.</h1><p>${S.flags.networkPass?'“Three Orchard exchanges and a missing manifest. Route the wards around whoever keeps ordering our capacity away.”':S.items.governor?'“It still turns. We can use that.”':'“The Cold Foundry still has a governor. Reach its intake through the Abyss. The Marshal’s feeds keep it shielded; break a coupler or isolate a feed. Bring me the governor.”'}</p><p>${S.items.anikHome?'Anik is mending timetables beside the kettle. There are seven cups now.':'An empty cup waits beside a brake operator’s photograph.'}</p><div class="row"><button data-action="expeditions">OUTER SALVAGE / EXPEDITIONS</button><button data-action="contracts">LOCAL WORK</button></div>`);save(true);hud();return true;}
 if(o.kind==='governor'){if(enemies().length){notify('The Marshal and its feeds still control this floor.');return true;}if(!S.items.governor){S.items.governor=true;gainXP(40);reward({scrap:10,ammo:32});log('Recovered the freight governor. Ada can restore the junction.');}notify('GOVERNOR RECOVERED // Return to Ada in Kettle Junction.');save(true);hud();return true;}

function epiloguePanel(){const id=S.greater.ending;if(!id){panel('A PLATFORM WAITING',`<p>The crew has not taken the final switch yet.</p>`);return;}const outcome={commons:'The wards set the timetable. Nobody rides free of responsibility, but nobody is left outside.',bonded:'The factors own the contracts. Your crew owns a dependable berth, and Ada keeps a pencil beside the small print.',crew:'Your names go above the platform. You decide which freight gets through. Independence means doing the work yourselves.'}[id];panel('THE COMMON LINE / ADVENTURE COMPLETE',`<h1>A place in the grid.</h1><p>${outcome}</p><p>${S.items.anikHome?'Anik puts seven cups beside the kettle.':'Ada leaves the seventh cup out. Some fares remain unpaid.'} ${S.flags.redoubtPeace?'Veterans from Redoubt Six unload flour with their rifles locked away.':S.contracts.armistice?.done?'A service record hangs above an empty checkpoint.':'The Redoubt’s old order remains somebody else’s problem.'} ${S.contracts.apprentice?.choice==='crew'?'Nix has already claimed a workbench.':S.contracts.apprentice?.choice==='clinic'?'Nix’s first clean bill of health is pinned above the clinic bed.':''}</p><p>${allCrew().map(a=>escape(a.callsign||a.name)+': '+(a.bond>=2?'a share of the platform and people worth coming back for.':'a bunk, a wage, and another chance.')).join('<br>')}</p><p>Far below, another timetable starts printing. Ada turns the sound down. Tonight, the kettle is enough.</p><p class="amber">Main adventure complete. Arc blade unlocked. The world stays open; expeditions and unfinished work remain.</p><div class="row"><button data-action="close">STAY A WHILE</button><button data-action="journal">CREW LEDGER</button><button data-action="expeditions">PLAN AN EXPEDITION</button></div>`);}

function expeditionBoard(){panel('OUTER SALVAGE / EXPEDITIONS',`<h1>Take a longer road.</h1><p>Three connected areas per trip. Recover the freight on the middle floor; bank it or open a deeper reserve. Fixed tiers, real supplies, optional elite caches. Save at any quiet point; return hatches extract from every area.</p><p class="amber">LV ${S.level} · ¢${S.credits} · ${S.ammo} spare rounds · ${S.meds} medkits</p><div class="grid">${Object.entries(UG.expeditions).map(([id,e])=>{const wins=S.greater.expeditionWins[id]||0,rate=activityRate(S.greater.expeditionReturns[id]||0),ready=S.items[e.requires]||S.flags[e.requires];return `<article class="card"><div class="tag">TIER ${e.tier} / THREE AREAS / ${wins} CLEARS / ${S.greater.expeditionReturns[id]||0} TRIPS</div><h3>${e.name}</h3><p>${e.text}</p><p>Entry ¢${expeditionFee(id)}. Base return: ¢${['service','signal'].includes(id)&&(S.greater.expeditionReturns[id]||0)>=5?8:Math.round(e.credits*rate)} · ${['service','signal'].includes(id)&&(S.greater.expeditionReturns[id]||0)>=5?1:Math.round(e.scrap*rate)} salvage · ${(S.greater.expeditionReturns[id]||0)<3?Math.round(e.xp*rate):0} XP, plus banked haul.<br>First freight return: ${rewardText(e.reward)}.<br>${ready?'Access ready.':'Requires '+(e.requires==='wardFreight'?'the restored Ward freight depot':e.requires==='wardAccess'?'Ward dispatch introduction':e.requires)+'.'} Departure: Disintegration Ward, Rustmarket, Kettle Junction or Cable Commons.${S.adventure.run?' Complete the short dispatch first.':battle?' Finish combat before departing.':S.greater.run?' Extract from the active expedition first.':!['hearth','market','junction','commons'].includes(S.room)?' Return to a departure settlement.':paths.size?' Stop moving before departing.':S.credits<expeditionFee(id)?' Insufficient entry credits.':''}</p><button data-expedition="${id}" ${ready&&!battle&&!S.greater.run&&!S.adventure.run&&['hearth','market','junction','commons'].includes(S.room)&&!paths.size&&S.credits>=expeditionFee(id)?'':'disabled'}>DEPART →</button></article>`;}).join('')}</div><p>Paid returns diminish over five trips, including withdrawals; XP only on the first three trips. After five returns, the original three routes stop paying materials/XP. Service Drains and Signal Ossuary keep a modest successful-delivery payment of ¢8 and one salvage, with no XP or repeat exceptional rewards; first-time patterns can still be recovered. Withdrawal without freight keeps half materials, no XP/patterns; a defeat keeps one quarter. Supplies and entry are spent.</p><button data-action="activities">SHORT DISPATCH JOBS</button>`);}
function startExpedition(family){const e=UG.expeditions[family];if(!e||battle||paths.size||S.adventure.run||S.greater.run||!['hearth','market','junction','commons'].includes(S.room)||!(S.items[e.requires]||S.flags[e.requires])||S.credits<expeditionFee(family))return false;
 const origin={room:S.room,x:selected().x,y:selected().y};save(true);S.credits-=expeditionFee(family);const seed=++S.greater.serial;S.greater.run={family,seed,origin,bag:{credits:0,scrap:0,xp:0},primary:false,control:false,vault:false,route:seed%2?'ward':'mill'};prepareExpedition(S.greater.run);for(let i=0;i<3;i++){const id='exp_'+family+'_'+i;S.world[id]=emptyWorld(UG.rooms[id]);}travel('exp_'+family+'_0',100,expeditionDefinitionEntry(family,0));log('Expedition departed: '+e.name+' / survey '+seed+'.');save(true);return true;
}
function expeditionInteract(o){const r=S.greater.run;if(!r)return false;if(battle&&(battle.phase!=='player'||paths.size))return true;
 const spend=()=>{if(battle&&!canAct(selected(),1))return false;if(battle)selected().ap--;return true;};const index=+S.room.slice(-1);
 if(o.kind==='extract'){if(!spend())return true;r.finished=r.primary?'success':'withdraw';battle=null;paths.clear();return true;}
 if(o.kind==='next'){if(index===1&&!r.control){notify('The deep route is sealed. Operate this floor’s pressure drive first.');return true;}if(!spend())return true;travel('exp_'+r.family+'_'+(index+1),100,expeditionDefinitionEntry(r.family,index+1));return true;}
 if(o.kind==='control'){if(r.control){notify('Deep route already open.');return true;}const engineer=actors().some(a=>a.hp>0&&['orren','latch'].includes(a.id));if(!engineer&&!S.items.cutter&&S.scrap<3){notify('The drive needs three salvage, a cutter or a crew engineer. Freight can still be banked without it.');return true;}if(!spend())return true;if(!engineer&&!S.items.cutter)S.scrap-=3;r.control=true;log('Deep reserve route opened.');notify('DEEP RESERVE OPEN // Optional risk beyond the contracted freight.');save(true);return true;}
 if(o.kind==='armistice'){if(!enemies().length){notify('The carriage is already quiet.');return true;}if(!spend())return true;for(const q of Object.values(world().enemies))if(q.hp>0){q.hp=0;q.spared=true;}checkBattle();notify('The old order releases the carriage garrison. Its deep cache remains.');save(true);return true;}
 if(world().opened[o.id]){notify('Already recovered.');return true;}if(o.kind==='vault'&&enemies().length){notify('The deep reserve is guarded. Clear its patrols or use its stand-down order.');return true;}if(!spend())return true;world().opened[o.id]=true;
 if(o.kind==='primary'){r.primary=true;r.bag.xp+=30;r.bag.scrap+=6;notify('CONTRACTED FREIGHT SECURED // Extract now or risk the deep reserve.');}
 if(o.kind==='cache'){const rate=activityRate(S.greater.expeditionReturns[r.family]||0);S.ammo+=Math.round(12*rate);if(index===1&&rate>0)S.meds++;r.bag.credits+=20+index*10;r.bag.scrap+=4+index*2;r.bag.xp+=12;notify('UNBANKED HAUL // Credits and salvage remain at risk until extraction.');}
 if(o.kind==='vault'){r.vault=true;r.bag.credits+=50;r.bag.scrap+=12;r.bag.xp+=45;notify('DEEP CACHE RECOVERED // Extract to claim its rare pattern.');}hud();save(true);return true;
}
function claimExpeditionEnemy(e,q){if(!S.greater.run)return false;if(q.rewarded)return true;q.rewarded=true;const r=S.greater.run,base=UG.enemyTypes[e.type];r.bag.xp+=Math.round(base.xp*(q.spared?.4:.6));r.bag.credits+=q.spared?0:Math.round(base.xp*.3);return true;}
function finishExpedition(){const r=S.greater.run;if(!r?.finished)return;const e=UG.expeditions[r.family],wins=S.greater.expeditionWins[r.family]||0,rate=activityRate(S.greater.expeditionReturns[r.family]||0),success=r.finished==='success',safety=success?1:r.finished==='defeat'?.25:.5;
 const payout={credits:Math.round((r.bag.credits+(success?e.credits:0))*rate*safety),scrap:Math.round((r.bag.scrap+(success?e.scrap:0))*rate*safety),xp:success&&(S.greater.expeditionReturns[r.family]||0)<3?Math.round((r.bag.xp+e.xp)*rate):0};if(success&&['service','signal'].includes(r.family)&&(S.greater.expeditionReturns[r.family]||0)>=5){payout.credits=8;payout.scrap=1;}reward(payout);gainXP(payout.xp);
 let pattern='';if(success){if(wins===0){reward(e.reward);pattern=rewardText(e.reward);}if(r.vault){const loot=r.family==='carriage'?{weapon:'arcblade'}:r.family==='mill'?{gear:'surveykit'}:{mod:'damped'};reward(loot);pattern+=(pattern?' · ':'')+rewardText(loot);}S.greater.expeditionWins[r.family]=wins+1;}
 const relicNames=wardBank(success,r.family);if(relicNames)pattern+=(pattern?' · ':'')+relicNames;S.greater.expeditionReturns[r.family]=(S.greater.expeditionReturns[r.family]||0)+1;for(const a of actors()){if(a.hp<=0)a.hp=Math.round(a.maxhp*.5);a.ap=0;a.watch=false;}for(const a of allCrew())if(a.grudge&&UG.expeditionIds.includes(a.grudge.room))a.grudge=null;const origin=r.origin;S.greater.run=null;prepareExpedition(null);for(const id of UG.expeditionIds)S.world[id]=emptyWorld(UG.rooms[id]);battle=null;paths.clear();travel(origin.room,origin.x,origin.y);
 const text=`¢${payout.credits} · ${payout.scrap} salvage · ${payout.xp} XP${pattern?' · '+pattern:''}`;log(e.name+' / '+r.finished+' / '+text);moment(success?'EXPEDITION BANKED':'EXPEDITION RETURNED',text,'NEXT ROAD','expeditions');save(true);hud();}
function expeditionVictory(){for(const e of room().enemies){const q=world().enemies[e.id];if(q.hp<=0)claimExpeditionEnemy(e,q);}if(combatEnemies().length)return false;for(const a of actors()){a.ap=0;a.watch=false;if(a.hp<=0)a.hp=Math.round(a.maxhp*.3);a.bondXP++;}world().cleared=!enemies().length;battle=null;paths.clear();notify('PATROL CLEARED // Haul remains unbanked. The return hatch is always an option.');save(true);hud();return true;}

/* Persistent Alpha 6 systems. Runtime animation never drives economic rewards. */
function wardUpgrade(d){
 if(!d.ward)d.ward={version:1,projects:{},rumors:{},recovered:[],events:{},machinery:0,cargo:[]};
 d.flags.wardAccess=true;d.journal=d.journal.map(t=>t.replaceAll('Last Light','Disintegration Ward').replaceAll('LAST LIGHT','DISINTEGRATION WARD'));return d;
}
function validateWard(d){const w=d.ward,own=(o,k)=>Object.hasOwn(o,k),bounded=n=>Number.isFinite(n)&&n>=0&&n<=1000000;
 if(!w||w.version!==1||!w.projects||!w.rumors||!w.events||!bounded(w.machinery)||!Array.isArray(w.recovered)||!Array.isArray(w.cargo))throw Error('Invalid Ward state.');
 for(const [id,p] of Object.entries(w.projects))if(!own(UG.wardProjects,id)||!p||!['building','ready'].includes(p.status)||!bounded(p.remaining)||p.remaining>8)throw Error('Invalid Ward project.');
 for(const [id,v] of Object.entries(w.rumors))if(!own(UG.relics,id)||!['heard','investigated','recovered'].includes(v))throw Error('Invalid rumor.');
 for(const [id,v] of Object.entries(w.events))if((!own(UG.wardEvents,id)&&id!=='serviceMachine')||v!==true)throw Error('Invalid optional event.');
 for(const a of [w.recovered,w.cargo])if(new Set(a).size!==a.length||a.some(id=>!own(UG.relics,id)))throw Error('Invalid relic manifest.');
 if(w.cargo.length&&!d.greater.run)throw Error('Relic freight without an expedition.');
 for(const id of w.recovered)if(!d[{weapon:'weapons',armorKey:'armors',gear:'gears',mod:'mods'}[UG.relics[id].kind]].includes(UG.relics[id].item))throw Error('Missing recovered relic.');
}
function wardReady(id){return S.ward.projects[id]?.status==='ready';}
function wardHere(id){const p=UG.wardProjects[id];return S.room==='hearth'&&inInteractionRange(selected(),p)&&!battle&&!paths.size;}
function wardReason(id){const p=UG.wardProjects[id];return S.ward.projects[id]?'Already commissioned.':p.requires&&!wardReady(p.requires)?'Requires '+UG.wardProjects[p.requires].name+'.':p.story&&!S.flags[p.story]?'Restore the relay with Mara first.':S.credits<p.credits||S.scrap<p.scrap?'Insufficient credits or salvage.':p.material&&S.ward.machinery<p.material?'Recover machinery on a successful Service Drains expedition or from the Sump hoist.':!wardHere(id)?'Visit the marked project in Disintegration Ward.':null;}
function wardPanel(){panel('DISINTEGRATION WARD / DEVELOPMENT',`<h1>Make a place worth returning to.</h1><p>Old maintenance decks, borrowed lamps, a hundred years of patchwork housing. Projects take eight seconds of active time in the Ward. You may leave; construction resumes when you return.</p><p class="amber">¢${S.credits} · ${S.scrap} salvage · ${S.ward.machinery} recovered machinery</p><div class="grid">${Object.entries(UG.wardProjects).map(([id,p])=>`<article class="card"><div class="tag">${S.ward.projects[id]?.status||'UNRESTORED'} / ${p.y===880?'GROUND CONCOURSE':p.y===660?'RESIDENTIAL DECK':'UPPER SIGNAL DECK'}</div><h3>${p.name}</h3><p>${p.benefit}</p><p>¢${p.credits} · ${p.scrap} salvage${p.material?' · 1 machinery':''}</p><p>${wardReason(id)||'Ready to commission here.'}</p><button data-ward-build="${id}" ${wardReason(id)?'disabled':''}>COMMISSION</button>${wardReady(id)?`<button data-ward-service="${id}">USE SERVICE</button>`:''}</article>`).join('')}</div><div class="row"><button data-action="expeditions">EXPEDITIONS / EARN MATERIALS</button><button data-action="rumors">RUMORS</button><button data-action="gallery">WEAPON GALLERY</button></div>`);}

 const cost=id==='armory'?4:3;if(S.scrap<cost){notify('Need '+cost+' salvage.');return false;}S.scrap-=cost;if(id==='armory')S.ammo+=24;else S.meds+=2;save(true);hud();notify(id==='armory'?'ARMORY // +24 ammunition':'INFIRMARY // +2 medkits');return true;

function wardRestore(){if(!wardReady('workshop')||!wardHere('workshop')||S.scrap<6)return false;const needed=allCrew().reduce((n,a)=>n+Math.max(0,weapon(a).mag-a.mag),0);if(!needed)return false;S.scrap-=6;for(const a of allCrew())a.mag=weapon(a).mag;save(true);hud();notify('WORKSHOP // Crew magazines restored.');return true;}
function wardRumor(id){if(!UG.relics[id]||S.ward.rumors[id])return false;S.ward.rumors[id]='heard';return true;}
function wardRumors(){panel('RUMORS / DISCOVERIES',`<h1>Listen between the machines.</h1><p>Talk to Nell, aid travelers, restore the listening station and inspect suspicious cases. Leads name regions; the map does not place exact markers.</p><div class="grid">${Object.entries(S.ward.rumors).map(([id,status])=>{const d=UG.relics[id];return `<article class="card"><div class="tag">${status.toUpperCase()}</div><h3>${d.name}</h3><p>${d.hint}</p>${status==='recovered'?`<p>${d.flavor}</p><p>${wardItem(d).desc}</p>`:''}</article>`;}).join('')||'<p>Nell waits at the Ward dispatch hatch, east of the lamp.</p>'}</div><button data-action="expeditions">EXPEDITION GUIDE</button>`);}
function wardItem(d){return ({weapon:UG.weapons,armorKey:UG.armors,gear:UG.gear,mod:UG.mods})[d.kind][d.item];}
function wardClaim(id){const d=UG.relics[id];if(!d||S.room!==d.room||battle||paths.size||selected().hp<=0||S.greater.run?.finished||!inInteractionRange(selected(),d)||S.ward.recovered.includes(id)||S.ward.cargo.includes(id))return false;
 S.ward.rumors[id]='investigated';if(enemies().length){notify('The case is guarded. Clear this district before recovering it.');return false;}if(d.gate&&!S.items[d.gate]&&!S.flags[d.gate]){notify('The seal needs '+itemName(d.gate)+'.');return false;}
 world().opened['relic-'+id]=true;if(S.greater.run){S.ward.cargo.push(id);notify('RELIC IN FREIGHT // Extract with the primary freight to bank '+d.name+'.');}else wardRecover(id);
 save(true);hud();return true;
}
function wardRecover(id){const d=UG.relics[id];if(S.ward.recovered.includes(id))return;unlock(d.kind,d.item);S.ward.recovered.push(id);S.ward.rumors[id]='recovered';log('Exceptional discovery: '+d.name+'. '+d.flavor);moment('EXCEPTIONAL EQUIPMENT / '+d.name,d.flavor+' '+wardItem(d).desc,'INSPECT','inventory');}
function wardBank(success,family){const names=success?S.ward.cargo.map(id=>UG.relics[id].name).join(' · '):'';if(success){for(const id of S.ward.cargo)wardRecover(id);if(family==='service'&&!S.ward.events.serviceMachine){S.ward.machinery++;S.ward.events.serviceMachine=true;}}S.ward.cargo=[];return names;}
function wardEvent(id){const e=UG.wardEvents[id];if(!e||S.room!==e.room||battle||paths.size||!inInteractionRange(selected(),e)||S.ward.events[id])return false;if(e.clear&&enemies().length||e.project&&!wardReady(e.project)||e.cost&&S[e.cost]<e.amount)return false;
 if(e.cost)S[e.cost]-=e.amount;reward(e.reward);S.ward.machinery+=e.material||0;S.ward.events[id]=true;wardRumor(e.lead);gainXP(15);log(e.name+' / resolved without changing the Common Line.');save(true);hud();notify('LOCAL WORK COMPLETE // '+rewardText(e.reward)+' · new rumor');return true;}
function wardEntry(){for(const [id,d] of Object.entries(UG.relics))if(S.room===d.room&&S.ward.rumors[id]==='heard')S.ward.rumors[id]='investigated';}
function wardHome(){panel('YOUR BUNK / DISINTEGRATION WARD',`<h1>A place on the wall.</h1><p>A patched blanket, an old route map and a communal equipment locker. Your equipment collection is shared with companions; nothing can be lost by moving it between fighters.</p><p>${S.ward.recovered.map(id=>UG.relics[id].name).join(' · ')||'The trophy rack is empty. The next road is yours.'}</p><button data-action="inventory">SHARED EQUIPMENT LOCKER</button><button data-action="roster">YOUR PEOPLE</button>`);}
function wardInteract(o){if(o.type!=='ward')return false;if(battle){notify('Finish the encounter before using this service.');return true;}
 if(o.kind==='project'){wardPanel();return true;}if(o.kind==='home'){wardHome();return true;}
 if(o.kind==='dispatch'){wardRumor('funeral');wardRumor('sunday');save(true);panel('NELL / OPTIONAL EXPEDITIONS',`<h1>Work beyond the bell.</h1><p>“The service drains are open. No story business, no fare. Bring ammunition and a friend if you can. Recover the pump freight on the middle floor, then extract; the deep reserve is optional. First successful delivery brings a machinery unit for our workshop.”</p><p>Quiet hatches save progress. Defeat or withdrawal loses relic freight. Credits, salvage and XP follow the expedition return rules.</p><button data-action="expeditions">AVAILABLE & LOCKED EXPEDITIONS</button><button data-action="rumors">THE COURIERS’ RUMORS</button>`);return true;}
 if(o.kind==='relic'){const d=UG.relics[o.relic];wardRumor(o.relic);S.ward.rumors[o.relic]=S.ward.recovered.includes(o.relic)?'recovered':'investigated';if(S.ward.recovered.includes(o.relic)||S.ward.cargo.includes(o.relic)){notify('This case is empty.');return true;}panel('SEALED DISCOVERY / '+d.name,`<p>${d.flavor}</p><p>${enemies().length?'Guards still control this district.':d.gate&&!S.items[d.gate]?'Requires '+itemName(d.gate):'The seal can be opened.'}</p><button data-ward-relic="${o.relic}">RECOVER EQUIPMENT</button>`);save(true);return true;}
 if(o.kind==='event'){const e=UG.wardEvents[o.event];panel(e.name,`<p>${e.text}</p><p>${S.ward.events[o.event]?'Completed.':e.project&&!wardReady(e.project)?'Requires '+UG.wardProjects[e.project].name:e.clear&&enemies().length?'Clear the local hostiles first.':e.cost?'Requires '+e.amount+' '+e.cost:'Ready to help.'}</p><button data-ward-event="${o.event}" ${S.ward.events[o.event]?'disabled':''}>HELP / INVESTIGATE</button>`);return true;}return false;
}
function wardHit(a,t,w){if(!w.chain||!t.enemy)return;const q=enemies().find(e=>e.id!==t.id&&dist(e,t)<=180&&shotInfo(t,e).legal);if(q){hurt(q,w.chain,a);tracer(t,q,'#8ed5cd');fx[fx.length-1].style='mercy';}}
function wardGallery(){panel('ARSENAL / EQUIPPED INSPECTION',`<h1>Tools for bad days.</h1><p>Every standard and exceptional firearm, drawn by the same renderer used for all fighters. Inspection does not grant equipment.</p><div class="grid">${Object.entries(UG.weapons).map(([id,w])=>`<article class="card"><h3>${w.name}</h3><canvas width="240" height="160" data-gallery="${id}"></canvas><p>${w.desc}</p></article>`).join('')}</div>`);for(const c of document.querySelectorAll('[data-gallery]')){const g=c.getContext('2d');g.save();g.translate(65,130);g.scale(2,2);drawFighterModel(g,{...selected(),weapon:c.dataset.gallery},{preview:true,time:0});g.restore();}}
function wardAction(id){if(id==='ward'){wardPanel();return true;}if(id==='rumors'){wardRumors();return true;}if(id==='gallery'){wardGallery();return true;}return false;}
function wardDraw(){const col=room().color;
 for(const o of room().objects.filter(o=>o.type==='ward')){const done=o.relic&&(S.ward.recovered.includes(o.relic)||S.ward.cargo.includes(o.relic))||o.event&&S.ward.events[o.event];if(done)continue;const near=inInteractionRange(selected(),o);outline(o.x-14,o.y-40,28,40,col);if(near||o.kind==='dispatch'||o.kind==='relic')text(o.kind==='relic'?'◇ RELIC':o.kind==='event'?'○ HELP':o.kind==='dispatch'?'↗ EXPEDITIONS':o.kind==='home'?'HOME':'◇ '+UG.wardProjects[o.project].name.toUpperCase(),o.x,o.y-59,col,10,'center');}
 if(S.room==='hearth'){
 for(const [id,p] of Object.entries(UG.wardProjects)){const state=S.ward.projects[id];if(!state)continue;const ready=state.status==='ready',c=ready?'#bde793':'#dfb179';outline(p.x-48,p.y-84,96,80,c);line(p.x-40,p.y-62,p.x+40,p.y-62,c,2);if(ready){rect(p.x-38,p.y-80,9,8,c);if(id==='armory'){for(let i=0;i<3;i++){line(p.x-28+i*22,p.y-45,p.x-18+i*22,p.y-20,c,2);line(p.x-18+i*22,p.y-20,p.x-13+i*22,p.y-24,c);}}else if(id==='infirmary'){for(let i=0;i<2;i++){outline(p.x-38+i*42,p.y-24,34,12,c);line(p.x-38+i*42,p.y-24,p.x-38+i*42,p.y-38,c);}}else if(id==='quarters'){outline(p.x-22,p.y-48,44,46,c);rect(p.x+6,p.y-30,4,4,c);}else if(id==='workshop'){line(p.x-35,p.y-27,p.x+35,p.y-27,c,3);line(p.x-30,p.y-27,p.x-30,p.y,c,2);line(p.x+30,p.y-27,p.x+30,p.y,c,2);if(Math.sin(clock*8)>.7){line(p.x+12,p.y-28,p.x+28,p.y-44,'#e9ead0');line(p.x+12,p.y-28,p.x-2,p.y-43,'#e9ead0');}}else if(id==='listening'){outline(p.x-30,p.y-50,60,28,c);line(p.x,p.y-50,p.x,p.y-100,c);line(p.x-22,p.y-92,p.x+22,p.y-92,c);}else for(let i=0;i<3;i++)outline(p.x-30+i*22,p.y-48,12,25,c);if(['power','workshop','freight','listening'].includes(id)){const a=clock*2;line(p.x,p.y-47,p.x+Math.cos(a)*16,p.y-47+Math.sin(a)*16,c,2);}if(id==='infirmary'){line(p.x-10,p.y-30,p.x+10,p.y-30,c,3);line(p.x,p.y-40,p.x,p.y-20,c,3);}figure({id:'ward-worker-'+id,x:p.x+45+Math.sin(clock*.5)*12,y:p.y,weapon:null,armorKey:'leathers',dir:-1},c);}else{line(p.x-45,p.y-5,p.x+45,p.y-78,c);text('BUILDING',p.x,p.y-95,c,10,'center');}}
 const count=3+Object.values(S.ward.projects).filter(p=>p.status==='ready').length;for(let i=0;i<count;i++){const deck=i%2?660:880;let x=310+(i*137)%950+Math.sin(clock*.3+i)*35;if(deck===660&&x>640&&x<930)x=x<800?630:940;figure({id:'ward-resident-'+i,x,y:deck,weapon:null,armorKey:i%3?'leathers':'mesh',dir:Math.cos(clock*.3+i)>0?1:-1},'#759486');if(i%3===0)outline(x-18,deck-25,13,14,'#85987c');}
 if(wardReady('freight')){const x=70+(clock*35)%280;rect(x,635,40,20,'#597260');outline(x,635,40,20,col);}if(wardReady('quarters'))text(S.ward.recovered.length+' RECOVERED / HOME',450,578,col,10,'center');
 }
 // Scenery actors are visual only: never added to enemies, collision or interaction lists.
 if(['market','yard','garden'].includes(S.room)&&(!enemies().length||room().theme==='settlement'))for(let i=0;i<2;i++)figure({id:'route-worker-'+i,x:280+i*150+Math.sin(clock*.2+i)*24,y:room().platforms[0].y,weapon:null,armorKey:'leathers'},'#78988a');
}
document.addEventListener('click',e=>{const el=e.target.closest('[data-ward-build],[data-ward-service],[data-ward-relic],[data-ward-event]');if(!el||!S)return;if(el.dataset.wardBuild)wardBuild(el.dataset.wardBuild);if(el.dataset.wardService==='restore')wardRestore();else if(el.dataset.wardService)wardService(el.dataset.wardService);if(el.dataset.wardRelic&&wardClaim(el.dataset.wardRelic))close();if(el.dataset.wardEvent&&wardEvent(el.dataset.wardEvent))close();});

title();requestAnimationFrame(frame);
})();
</script></body></html>
