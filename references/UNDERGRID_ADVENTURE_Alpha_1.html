function finishPlayerTurn(){if(!battle)return;battle.busy=true;refreshBattleUI();setTimeout(()=>{if(!battle)return;if(!battleAlive().length){endBattle(true);return}companionsTurn();setTimeout(()=>{if(!battle)return;if(!battleAlive().length){endBattle(true);return}enemyTurn();},450)},380)}

 for(let enemy of room.enemies){let y=ground+enemy.y;const c=enemy.boss?C.red:'#e8a96d';let s=enemy.boss?1.9:1.16;drawFigure(ctx,enemy.x,y,s,c,ENEMIES[enemy.type].kind,ENEMIES[enemy.type].style==='gun'?'rifle':'',enemy.dir,now*.2);if(enemy.boss){txt('◆ '+BOSSES[S.region][0].toUpperCase()+' ◆',enemy.x,y-111,11,C.red,'center');line(enemy.x-38,y-105,enemy.x+38,y-105,C.red,2)}}
 // hero and follower are always in front of props
 S.activeCompanions.forEach((id,i)=>{let c=COMPANIONS.find(x=>x.id===id);if(c){let dx=S.x-(i+1)*48*S.dir;drawFigure(ctx,dx,ground,1.0,C.cyan,c.kind,'rifle',S.dir,now*(heldRight()||heldLeft()?1:0));txt(c.name,dx,ground-70,8,C.cyan,'center')}});
 drawFigure(ctx,S.x,S.y||ground,1.18,C.ink,'human',S.weapon,S.dir,now*(heldRight()||heldLeft()?1:0));
 // avatar status marker anchored above silhouette, not overlapping body
 txt('▼',S.x,(S.y||ground)-80,11,C.ink,'center');
 ctx.restore();
 // sector heading and minimap light UI in scene
 txt(`${String(r+1).padStart(2,'0')} / ${room.reg.name}`,16,27,12,room.reg.color);
 txt(`LOCATION ${room.n+1}/6 // ${room.reg.rooms[room.n]}`,16,44,10,C.dim);
 let mw=Math.min(195,W*.24),mx=W-mw-18;fillRect(mx,19,mw,22,'#04110fd9');ctx.strokeStyle='#34634d';ctx.strokeRect(mx,19,mw,22);fillRect(mx+8,30,mw-16,2,'#2a5542');fillRect(mx+8+(mw-16)*clamp(S.x/WORLD_W,0,1)-2,26,5,10,C.ink);room.enemies.forEach(e=>fillRect(mx+8+(mw-16)*e.x/WORLD_W,29,3,4,C.red));
 const closest=nearestInteract();if(closest){const name={safe:'REST & SAVE',workshop:'UPGRADE EQUIPMENT',switch:S.opened[currentKey()+':switch']?'POWER OFF':'SHUT DOWN HAZARDS',relic:'OPEN HIDDEN CACHE',vendor:'TRADE',board:'OBJECTIVES',terminal:'READ ARCHIVE',chest:'OPEN CRATE',cache:'SALVAGE CACHE',side:'ENTER SIDE ROUTE',sideBack:'RETURN TO ROUTE',gate:S.bosses[S.region]?'OPEN GATE':'GATE SEALED',transit:'FAST TRAVEL',recruit:'RECRUIT '+closest.companion?.name}[closest.type];$('#hint').textContent=`[E] ${name}`;$('#hint').style.display='block'}else $('#hint').style.display='none';}
function drawBattle(){if(!battle)return;let reg=room.reg;fillRect(0,0,W,H,reg.sky); // In combat, retain the room's industrial setting without platform mechanics.
 let hold=cam;cam=0;drawSceneBase();cam=hold;fillRect(0,ground,W,H-ground,'#111d16');fillRect(0,ground,W,8,reg.floor);
 for(let i=0;i<12;i++){let x=i*110;fillRect(x,ground-10,28,10,'#294938');fillRect(x+7,ground-15,4,5,'#759b70')}
 drawFigure(ctx,W*.21,ground,Math.min(2.0,W/470),C.ink,'human',S.weapon,1);
 txt('YOU',W*.21,ground-116,12,C.ink,'center');
 S.activeCompanions.forEach((id,i)=>{let c=COMPANIONS.find(x=>x.id===id);let xx=W*(.06+i*.095);drawFigure(ctx,xx,ground,Math.min(1.4,W/800),C.cyan,c.kind,'rifle',1);txt(c.name,xx,ground-90,10,C.cyan,'center')});
 battle.enemies.forEach((e,i)=>{if(e.hp<=0)return;let x=battleEnemyX(i),s=e.boss?1.85:1.35;drawFigure(ctx,x,ground,s,e.boss?C.red:'#ffba77',e.kind,e.style==='gun'?'rifle':'',-1,now*.25);let bw=e.boss?100:78;fillRect(x-bw/2,ground-85*s,bw,5,'#542b25');fillRect(x-bw/2,ground-85*s,bw*e.hp/e.maxhp,5,C.red);if(i===battle.selected){txt('▼',x,ground-85*s-11,14,C.amber,'center');txt(e.name.toUpperCase(),x,ground-85*s-28,10,C.amber,'center')}if(e.shock){txt('⚡',x+18,ground-70*s,13,C.cyan)}if(e.burn){txt('!',x-20,ground-70*s,13,C.red)}});
 if(battle.flash>0){ctx.globalAlpha=battle.flash*1.2;fillRect(W*.25,ground-64,battle.hitX-W*.25,3,C.amber);fillRect(battle.hitX-15,ground-67,30,10,C.amber);ctx.globalAlpha=1}
 txt('TURN '+battle.round+'  •  '+battleAlive().length+' HOSTILES',W/2,56,10,C.dim,'center');
}
function updateFx(dt){for(let p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=130*dt;p.life-=dt;}particles=particles.filter(p=>p.life>0);for(let t of texts){t.y-=32*dt;t.life-=dt}texts=texts.filter(t=>t.life>0);if(battle&&battle.flash>0)battle.flash=Math.max(0,battle.flash-dt)}
function drawFx(){if(!room)return;ctx.save();if(!battle)ctx.translate(-cam,0);for(let p of particles){ctx.globalAlpha=clamp(p.life/p.max,0,1);fillRect(p.x,p.y,p.s,p.s,p.c)}for(let t of texts){ctx.globalAlpha=clamp(t.life,0,1);txt(t.text,t.x,t.y,15,t.c,'center')}ctx.globalAlpha=1;ctx.restore()}
function draw(){ctx.clearRect(0,0,W,H);if(!room)return;if(battle)drawBattle();else drawWorld();drawFx();}
function frame(ts){let dt=Math.min(.033,(ts-last)/1000||.016);last=ts;now=ts/1000;if(S&&room){if(!battle&&!modal)movement(dt);let target=clamp(S.x-W*.42,0,Math.max(0,WORLD_W-W));cam+=(target-cam)*Math.min(1,dt*6);updateFx(dt);draw()}if(toastTill&&ts>toastTill){$('#notification').classList.remove('on');toastTill=0}just={};requestAnimationFrame(frame)}
function playBeep(freq=360,duration=.055){if(!sound)return;try{if(!window._audio)window._audio=new (window.AudioContext||window.webkitAudioContext)();let a=window._audio,o=a.createOscillator(),gain=a.createGain();o.type='square';o.frequency.value=freq;gain.gain.value=.012;o.connect(gain);gain.connect(a.destination);o.start();o.stop(a.currentTime+duration)}catch(e){}}
function handleKey(e,down){let k=e.key;if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' ','Tab'].includes(k))e.preventDefault();keys[k]=down;if(!down)return;if(e.repeat)return;
 if(k==='Escape'){if(battle){if(battle.menu!=='main'){battle.menu='main';refreshBattleUI()}return}if(modal==='title')return;if(modal)closeModal();else openPanel('options');return}
 if(modal)return;
 if(battle){if(k==='Tab'){chooseTarget(1);return}if(k>='1'&&k<='5'){const idx=Number(k)-1;const btn=$('#battleControls').querySelectorAll('button')[idx];btn?.click()}return}
 if(k==='e'||k==='E'||k==='Enter')just.interact=true;
 if(k==='w'||k==='W'||k==='ArrowUp'||k===' '||k==='j')just.jump=true;
 if(k==='r'||k==='R')just.reload=true;
 if(k==='m'||k==='M')just.map=true;
 if(k==='i'||k==='I')just.pack=true;
 if(k==='c'||k==='C')openPanel('party');
}
window.addEventListener('keydown',e=>handleKey(e,true));window.addEventListener('keyup',e=>handleKey(e,false));window.addEventListener('blur',()=>{keys={};touchHeld={}});window.addEventListener('resize',resize);
canvas.addEventListener('click',e=>{if(battle&&!battle.busy){let x=e.clientX-canvas.getBoundingClientRect().left;let closest=-1,d=999;for(let i=0;i<battle.enemies.length;i++){if(battle.enemies[i].hp<=0)continue;let q=Math.abs(battleEnemyX(i)-x);if(q<d){d=q;closest=i}}if(d<105){battle.selected=closest;refreshBattleUI();playBeep(630)}}});
const touchMap=[['touchLeft','ArrowLeft'],['touchRight','ArrowRight'],['touchJump','jump'],['touchAct','interact'],['touchBag','pack']];for(let [id,k] of touchMap){let el=$('#'+id);el.addEventListener('pointerdown',e=>{e.preventDefault();el.setPointerCapture(e.pointerId);if(k==='jump')just.jump=true;else if(k==='interact')just.interact=true;else if(k==='pack')just.pack=true;else touchHeld[k]=true});el.addEventListener('pointerup',e=>{if(k==='ArrowLeft'||k==='ArrowRight')touchHeld[k]=false});el.addEventListener('pointercancel',()=>{touchHeld[k]=false})}
$('#actions').addEventListener('click',e=>{let btn=e.target.closest('button[data-panel]');if(btn)openPanel(btn.dataset.panel)});
resize();requestAnimationFrame(frame);showTitle();
