function route(a,tx,ty){const ps=room().platforms, start=floorAt(a), end=ps.find(p=>Math.abs(p.y-ty)<12&&tx>=p.x&&tx<=p.x+p.w);if(!start||!end)return null;

 d.expansion=1;d.scrap=12;d.contracts={};d.reputation=0;d.sorties={};d.armors=['leathers'];d.gears=['none'];d.mods=['none'];}
 for(const a of [...d.party,...d.reserve]){if(old||a.armorKey===undefined){a.armorKey='leathers';a.gear='none';a.mod='none';a.talents={aim:0,power:0,runner:0,medic:0};a.points=Math.max(0,(d.level||1)-1);a.bond=0;a.bondXP=0;a.callsign=a.name;a.dye=a.id==='vera'?'cyan':a.id==='orren'?'amber':'phosphor';}a.color=UG.dyes[a.dye]||a.color;}

function useSkill(id){const a=selected(),s=UG.skills[id];if(!s||!a.skills.includes(id)||!battle||battle.phase!=='player')return false;const target=chosenTarget();close();
 if(id==='dash'){grenadeMode=toolMode=false;if(a.usedSkills.dash){notify('Dash already used this round.');return false;}if(!canAct(a,1))return false;dashMode=true;notify('DASH // Click a route within '+Math.round(moveAllowance(a)*1.8)+' units. 1 AP.');return true;}
 if(id==='breach'){dashMode=toolMode=false;if(!canAct(a,2)||!S.grenades){notify('Requires 2 AP and a frag.');return false;}battle.shaped=true;grenadeMode=true;notify('SHAPED FRAG // Click a location. Allies can be hit.');return true;}
 if(!canAct(a,s.cost))return false;if(id==='patch'&&!alive().some(b=>dist(a,b)<180&&(b.hp<b.maxhp||b.burn||b.toxin))){notify('Nearby crew are healthy.');return false;}
 if(a.usedSkills[id]||id==='patch'&&a.patchUsed||id==='overload'&&a.overloadUsed){notify('That ability has already been used.');return false;}

 if(id==='overload'&&(!target||dist(a,target)>600||!shotInfo({...a,weapon:'arc'},target).legal)){notify('Choose a visible target within 600 units.');return false;}
 a.ap-=s.cost;a.usedSkills[id]=true;
 if(id==='deadeye'){a.aimed=true;float(a,'DEADEYE');}

 if(id==='patch'){a.patchUsed=true;const friend=alive().filter(b=>dist(a,b)<180&&(b.hp<b.maxhp||b.burn||b.toxin)).sort((a,b)=>a.hp/a.maxhp-b.hp/b.maxhp)[0]||a;friend.hp=Math.min(friend.maxhp,friend.hp+35);friend.burn=friend.toxin=0;float(friend,'PATCH +35');}
 if(id==='overload'){a.overloadUsed=true;world().enemies[target.id].shocked=true;world().enemies[target.id].suppressed=true;if(['drone','stabilizer','excavator'].includes(target.type))hurt(target,12,a);float(target,'OVERLOAD','#8ed5cd');}

}

function validateAdventure(d){const a=d.adventure;if(a?.run)throw Error('Active jobs cannot be imported.');if(!a||a.version!==1||typeof a.autoNext!=='boolean'||typeof a.fastTurns!=='boolean'||typeof a.hints!=='boolean'||!a.activityWins||!Array.isArray(a.moments)||a.moments.some(m=>typeof m.title!=='string'||typeof m.body!=='string'))throw Error('Invalid adventure state.');for(const [id,n] of Object.entries(a.activityWins))if(!Object.hasOwn(UG.activities,id)||!Number.isInteger(n)||n<0||n>100000)throw Error('Invalid work record.');for(const p of [...d.party,...d.reserve]){if(!Array.isArray(p.skills)||p.skills.length>3||new Set(p.skills).size!==p.skills.length||p.skills.some(id=>!Object.hasOwn(UG.skills,id))||!Number.isInteger(p.abilityPoints)||p.abilityPoints<0||p.abilityPoints>3||!p.calibrations||!Array.isArray(p.quickSlots)||p.quickSlots.length>2||p.quickSlots.some(id=>!d.weapons.includes(id)))throw Error('Invalid ability loadout.');for(const [id,n] of Object.entries(p.calibrations))if(!Object.hasOwn(UG.weapons,id)||!Number.isInteger(n)||n<0||n>3)throw Error('Invalid calibration.');}}

function activityEnemy(e){const r=S.adventure.run;if(!r||UG.activities[r.id].objective!=='defend')return false;
 const relay={id:'relay',x:600,y:880,hp:r.assetHP,maxhp:100,armor:3};let info=shotInfo(e,relay);if(!info.legal){const path=route(e,relay.x,relay.y);if(path){let budget=260;for(const p of path.points){const d=dist(e,p);if(d<=budget){e.x=p.x;e.y=p.y;budget-=d;}else{if(Math.abs(p.y-e.y)>1){e.x=p.x;e.y=p.y;}else e.x+=(p.x-e.x)/d*budget;break;}}Object.assign(world().enemies[e.id],{x:e.x,y:e.y});info=shotInfo(e,relay);e.ap--;}}

function floorLabel(y){const ys=[...new Set(room().platforms.map(p=>p.y))].sort((a,b)=>b-a),i=ys.findIndex(v=>Math.abs(v-y)<20);return i===0?'ground deck':i>0?'deck '+i:'a marked deck';}

function backupStrike(a,t){const info=shotInfo({...a,weapon:'chainblade'},t);if(dist(a,t)>=70||!info.legal){notify(info.reason||'Move within knife range.');return false;}if(!canAct(a,1))return false;a.ap--;hurt(t,Math.max(3,15+S.level*2-Math.max(0,armorSave(t)-1)),a);animate(a,'fire',.3);checkBattle();hud();afterOrder();return true;}

function emptyWorld(r){return {enemies:Object.fromEntries(r.enemies.map(e=>[e.id,{hp:e.dormant?0:UG.enemyTypes[e.type].hp,x:e.x,y:e.y}])),opened:{},covers:{},machines:{}};}
function storyRoomIds(){return Object.keys(UG.rooms).filter(id=>id!=='trial'&&!UG.expeditionIds.includes(id));}
function prepareExpedition(run){for(const f of Object.keys(UG.expeditions))for(let i=0;i<3;i++)UG.rooms['exp_'+f+'_'+i]=expeditionDefinition(f,i,run?.family===f?run.seed:0);}
function greaterUpgrade(d){if(!d||!d.world||!Array.isArray(d.party))return d;const old=!d.greater;
 if(old)d.greater={version:1,factions:{wards:0,factors:0},charter:null,relays:[],ending:null,expeditionWins:{},expeditionReturns:{},serial:0,run:null};
 if(d.greater.run&&(!UG.expeditions[d.greater.run.family]||!Number.isInteger(d.greater.run.seed)||d.greater.run.seed<1||d.greater.run.seed>1000000))throw Error('Invalid expedition survey.');if(!d.greater.expeditionReturns)d.greater.expeditionReturns={...d.greater.expeditionWins};prepareExpedition(d.greater.run);
 for(const id of [...UG.greaterStoryRooms,...UG.expeditionIds])if(!d.world[id])d.world[id]=emptyWorld(UG.rooms[id]);
 if(old)for(const e of UG.rooms.redoubt.enemies)if(e.dormant)d.world.redoubt.enemies[e.id].hp=0;
 return d;
}
function validateGreater(d){const g=d.greater,number=n=>Number.isFinite(n)&&n>=0&&n<=1e7;
 if(!g||g.version!==1||!g.factions||!['wards','factors'].every(k=>Number.isInteger(g.factions[k])&&Math.abs(g.factions[k])<=100)||!Array.isArray(g.relays)||new Set(g.relays).size!==g.relays.length||g.relays.some(k=>!['a','b','c'].includes(k))||!Number.isInteger(g.serial)||g.serial<0||g.serial>1000000||!g.expeditionWins||![null,'commons','bonded'].includes(g.charter)||![null,'commons','bonded','crew'].includes(g.ending))throw Error('Invalid Common Line state.');
 for(const [id,n] of Object.entries({...g.expeditionWins,...g.expeditionReturns}))if(!UG.expeditions[id]||!Number.isInteger(n)||n<0||n>1000000)throw Error('Invalid expedition record.');
 if(g.run){const r=g.run;if(!UG.expeditions[r.family]||!Number.isInteger(r.seed)||r.seed<1||r.seed>1000000||!storyRoomIds().includes(r.origin?.room)||!number(r.origin.x)||!number(r.origin.y)||r.origin.x>UG.rooms[r.origin.room].w||r.origin.y>UG.rooms[r.origin.room].h||typeof r.primary!=='boolean'||typeof r.control!=='boolean'||typeof r.vault!=='boolean'||!r.bag||!['credits','scrap','xp'].every(k=>number(r.bag[k]))||!['ward','mill'].includes(r.route)||!UG.expeditionIds.includes(d.room)||!d.room.startsWith('exp_'+r.family+'_')||r.finished)throw Error('Invalid expedition checkpoint.');}
 else if(UG.expeditionIds.includes(d.room))throw Error('Missing active expedition.');
}
function campaignAct(){return !S.ending?1:!S.flags.commonPass?2:!S.flags.networkPass?3:!S.flags.heartPass?4:!S.flags.lineComplete?5:6;}
function mainObjective(){const act=campaignAct();if(act===1)return openingObjective();if(act===2){const tasks=[];if(!S.flags.railPass)tasks.push('repair Locomotive 09');if(!S.flags.convoy)tasks.push('deliver its first freight');if(!S.flags.sluice)tasks.push('restore clean water');return 'ACT II / '+(tasks.length?tasks.join(', ')+'. Work boards in Rustmarket.':'Ratify a charter at the Common Line desk, Rustmarket ground concourse.');}
 if(act===3)return S.items.governor?'ACT III / Return the Cold Foundry governor to Ada at Kettle Junction.':'ACT III / Take the high Dead Rail outer freight to Kettle Junction. Ada needs the Cold Foundry governor beyond the Abyss.';
 if(act===4)return 'ACT IV / '+(S.greater.relays.length<3?'Reconnect the three Relay Orchard exchanges. ':'')+(!S.items.unlistedManifest?'Find the manifest in the Unlisted Station above the Orchard.':'Check an exchange to open the Heart conduit.');
 if(act===5)return 'ACT V / Stop the Receiver in Load-Bearing Heart. Release its two couplers; take the far switch.';
 return 'THE COMMON LINE / Your platform is open at Cable Commons. Visit the crew ledger, explore, or take an expedition.';
}
function greaterObjective(){if(S.greater.run){const r=S.greater.run;return UG.expeditions[r.family].name+' / '+(r.primary?'Freight recovered. Extract to bank it, or push deeper.':'Find the contracted freight on the second work floor.')+` Unbanked: ¢${r.bag.credits} · ${r.bag.scrap} salvage. Return hatch: west entrance. ${lifeObjectives(r)}`;}return null;}
function atStory(kind){return room().objects.some(o=>o.type==='story'&&o.kind===kind&&inInteractionRange(selected(),o));}
function charterPanel(){const ready=S.ending&&S.flags.railPass&&S.flags.convoy&&S.flags.sluice,here=atStory('charter');panel('THE COMMON LINE / ACT II',`<h1>A line worth keeping.</h1><p>The Bell Engine returned a charter for stations beyond the survey. The locomotive can reach them. Someone must guarantee freight, water and safe passage before the wards will sign.</p><p>${S.ending?'✓':'○'} Bell Engine channel<br>${S.flags.railPass?'✓':'○'} Locomotive repaired<br>${S.flags.convoy?'✓':'○'} First freight delivered<br>${S.flags.sluice?'✓':'○'} Clean-water sluice</p><div class="grid"><article class="card"><h3>Common carriage</h3><p>Give the wards a public stake. +2 ward trust, -1 factor trust, two medkits and six salvage. Supports a public conclusion.</p><button data-charter="commons" ${ready&&here&&!S.greater.charter?'':'disabled'}>SIGN FOR THE WARDS</button></article><article class="card"><h3>Bonded freight</h3><p>Let freight factors back the repair. +2 factor trust, -1 ward trust, ¢100 and a supplier discount. Supports a bonded conclusion.</p><button data-charter="bonded" ${ready&&here&&!S.greater.charter?'':'disabled'}>TAKE THE FACTORS’ BOND</button></article></div><p>${S.greater.charter?'Charter signed. The high Dead Rail outer freight is open.':!here?'Sign at Rustmarket’s Common Line desk on the ground concourse.':'Existing work boards carry the required jobs. No extra reputation grind is required.'}</p><button data-action="contracts">WORK BOARD</button>`);}
function signCharter(id){if(!['commons','bonded'].includes(id)||battle||!atStory('charter')||S.greater.charter||!S.ending||!S.flags.railPass||!S.flags.convoy||!S.flags.sluice)return false;S.greater.charter=id;S.flags.commonPass=true;S.greater.factions[id==='commons'?'wards':'factors']+=2;S.greater.factions[id==='commons'?'factors':'wards']--;reward(id==='commons'?{meds:2,scrap:6}:{credits:100});gainXP(65);close();moment('ACT III / THE DEEP WORKS','The Dead Rail crown platform now serves Kettle Junction. Follow the outer freight.','JOURNAL','journal');log('Signed the Common Line charter: '+id+'.');save(true);hud();return true;}
function greaterInteract(o){if(!o)return false;if(o.type==='expedition')return expeditionInteract(o);if(S.greater.run&&o.type==='door'){
 if(battle&&(battle.phase!=='player'||paths.size))return true;if(battle&&!canAct(selected(),1))return true;if(battle)selected().ap--;travel(o.to,o.sx,o.sy);return true;}
 if(o.type!=='story')return false;
 if(o.kind==='notice'){panel('ONE FREIGHT LINE IS ONLY A BEGINNING',`<p>${S.ending?'The Engine’s charter names stations beyond the Dead Rail. Ada left a proposal on Rustmarket’s ground concourse.':'Mara taps a folded freight map. “First we get this lamp working. Then we see who else is still out there.”'}</p><button data-action="journal">MAIN STORY</button>`);return true;}
 if(o.kind==='charter'){if(!battle)charterPanel();return true;}
 if(o.kind==='ada'){if(battle)return true;if(S.items.governor&&!S.flags.networkPass){S.flags.networkPass=true;reward({weapon:'burst',mod:'damped',credits:100,ammo:36});gainXP(100);moment('ACT IV / THE HIDDEN NETWORK','The governor carries a second timetable. The Relay Orchard service duct is powered.','ARSENAL','catalog');log('Ada fitted the governor. Kettle Junction has heat and an eastern service route.');}
 if(S.items.anikRescued&&!S.items.anikHome){S.items.anikHome=true;S.greater.factions.wards++;gainXP(35);log('Anik came home. Ada fills the seventh cup.');}
 panel('ADA / DISPATCH IS A KIND OF PROMISE',`<h1>Keep the kettle on.</h1><p>${S.flags.networkPass?'“Three Orchard exchanges and a missing manifest. Route the wards around whoever keeps ordering our capacity away.”':S.items.governor?'“It still turns. We can use that.”':'“The Cold Foundry still has a governor. Reach its intake through the Abyss. The Marshal’s feeds keep it shielded; break a coupler or isolate a feed. Bring me the governor.”'}</p><p>${S.items.anikHome?'Anik is mending timetables beside the kettle. There are seven cups now.':'An empty cup waits beside a brake operator’s photograph.'}</p><div class="row"><button data-action="expeditions">OUTER SALVAGE / EXPEDITIONS</button><button data-action="contracts">LOCAL WORK</button></div>`);save(true);hud();return true;}
 if(o.kind==='governor'){if(enemies().length){notify('The Marshal and its feeds still control this floor.');return true;}if(!S.items.governor){S.items.governor=true;gainXP(40);reward({scrap:10,ammo:32});log('Recovered the freight governor. Ada can restore the junction.');}notify('GOVERNOR RECOVERED // Return to Ada in Kettle Junction.');save(true);hud();return true;}
 if(o.kind==='relay'){if(!S.flags.networkPass){notify('Ada must fit the governor first.');return true;}if(!S.greater.relays.includes(o.relay)){if(battle&&!canAct(selected(),1))return true;if(battle)selected().ap--;S.greater.relays.push(o.relay);gainXP(25);audioCue('machine');log('Orchard exchange '+o.relay.toUpperCase()+' connected.');}checkNetwork();notify('EXCHANGES '+S.greater.relays.length+'/3 // '+(S.flags.heartPass?'Heart conduit open.':S.items.unlistedManifest?'Reconnect the remaining exchanges.':'The Unlisted Station above has the missing manifest.'));save(true);hud();return true;}
 if(o.kind==='manifest'){if(!S.items.unlistedManifest){S.items.unlistedManifest=true;gainXP(35);log('The manifest lists capacity, not passengers. Every shipment is marked RESERVED.');}checkNetwork();panel('THE UNLISTED MANIFEST',`<p>The freight is not being lost. It is being requisitioned. The last destination is a load-bearing engine under the Orchard. Every station has been paying for an order nobody remembers placing.</p><p>One page names tomorrow’s delivery. It has not been printed yet.</p><p class="amber">${mainObjective()}</p>`);save(true);return true;}
 if(o.kind==='rescue'){if(S.items.anikRescued){notify('Anik is on the way to Ada.');return true;}const engineer=actors().some(a=>a.hp>0&&['orren','latch'].includes(a.id));if(!engineer&&!S.items.cutter&&S.scrap<4){notify('Anik is trapped behind a shutter. Cutter, an engineer or four salvage opens it.');return true;}if(!engineer&&!S.items.cutter)S.scrap-=4;S.items.anikRescued=true;gainXP(30);log('Anik rescued. They know a return service passage to Kettle Junction.');panel('ANIK / THE SEVENTH CUP',`<p>“Tell Ada the brakes held. I didn’t run. I just couldn’t get the shutter open.”</p><p>Anik takes a safe service passage. Return to Ada to reunite them, then settle Seven cups, six names at a work board.</p>`);save(true);return true;}
 if(o.kind==='armistice'){if(!enemies().length){notify('The order is too late for this checkpoint. Recover its service record.');return true;}if(battle&&(battle.phase!=='player'||paths.size))return true;if(battle&&!canAct(selected(),1))return true;if(battle)selected().ap--;for(const e of Object.values(world().enemies))if(e.hp>0){e.hp=0;e.spared=true;}S.items.redoubtRecord=true;S.flags.redoubtPeace=true;log('The armistice order releases Redoubt Six from its last shift.');checkBattle();notify('STAND DOWN // The checkpoint opens without executions. Recover the service case.');save(true);return true;}
 if(o.kind==='redoubtReward'){if(enemies().length){notify('The checkpoint still holds. Find the armistice order above, or defeat its commander.');return true;}if(!world().opened[o.id]){world().opened[o.id]=true;S.items.redoubtRecord=true;reward({mod:'deepfeed',ammo:36,credits:60});gainXP(30);}notify('REDOUBT SERVICE PATTERN // Breach feed unlocked.');save(true);return true;}
 if(o.kind==='conclusion'){if(enemies().length){notify('Release the two tethers and stop the Receiver before taking the switch.');return true;}if(!S.flags.heartPass){notify('The Orchard exchanges and manifest are still needed.');return true;}endingPanel();return true;}
 if(o.kind==='epilogue'){epiloguePanel();return true;}return true;
}
function checkNetwork(){if(S.greater.relays.length===3&&S.items.unlistedManifest&&!S.flags.heartPass){S.flags.heartPass=true;gainXP(65);moment('ACT V / A PLACE IN THE GRID','The Heart conduit below the Orchard is open. The requisition engine is stripping the wards to fill a forgotten order.','JOURNAL','journal');log('Orchard bypass complete. The crew has a route to the requisition engine.');}}
function endingPanel(){panel('THE LAST SWITCH / ACT V',`<h1>Who gets a place?</h1><p>The engine stops asking. The platform lights wait for your hand. No one here knows who placed the first order. You know who has been paying it.</p><div class="grid">${[['commons','A common line','Public capacity for the wards. Requires ward trust or local standing; six medkits and a public platform.'],['bonded','A line under bond','Let the factors guarantee freight. Requires their bond or trust; ¢180 and a contracted platform.'],['crew','A crew’s own charter','Keep the platform independent. Always available; 30 salvage and your own workshop.']].map(([id,name,desc])=>`<article class="card"><h3>${name}</h3><p>${desc}</p><button data-ending="${id}" ${endingAvailable(id)&&!S.greater.ending?'':'disabled'}>TAKE THE SWITCH</button></article>`).join('')}</div>`);}
function endingAvailable(id){return id==='crew'||id==='commons'&&(S.greater.factions.wards>=1||S.reputation>=1)||id==='bonded'&&(S.greater.charter==='bonded'||S.greater.factions.factors>=1);}
function finishCampaign(id){if(!['commons','bonded','crew'].includes(id)||!atStory('conclusion')||battle||enemies().length||!S.flags.heartPass||S.greater.ending||!endingAvailable(id))return false;S.greater.ending=id;S.flags.lineComplete=true;reward({weapon:'arcblade',...(id==='commons'?{meds:6}:id==='bonded'?{credits:180}:{scrap:30})});gainXP(150);log('The Common Line belongs to '+({commons:'the wards',bonded:'its freight guarantors',crew:'the crew'}[id])+'.');for(const a of allCrew()){a.hp=a.maxhp;a.bond=Math.min(3,a.bond+1);}travel('commons',650,880);epiloguePanel();save(true);return true;}
function epiloguePanel(){const id=S.greater.ending;if(!id){panel('A PLATFORM WAITING',`<p>The crew has not taken the final switch yet.</p>`);return;}const outcome={commons:'The wards set the timetable. Nobody rides free of responsibility, but nobody is left outside.',bonded:'The factors own the contracts. Your crew owns a dependable berth, and Ada keeps a pencil beside the small print.',crew:'Your names go above the platform. You decide which freight gets through. Independence means doing the work yourselves.'}[id];panel('THE COMMON LINE / ADVENTURE COMPLETE',`<h1>A place in the grid.</h1><p>${outcome}</p><p>${S.items.anikHome?'Anik puts seven cups beside the kettle.':'Ada leaves the seventh cup out. Some fares remain unpaid.'} ${S.flags.redoubtPeace?'Veterans from Redoubt Six unload flour with their rifles locked away.':S.contracts.armistice?.done?'A service record hangs above an empty checkpoint.':'The Redoubt’s old order remains somebody else’s problem.'} ${S.contracts.apprentice?.choice==='crew'?'Nix has already claimed a workbench.':S.contracts.apprentice?.choice==='clinic'?'Nix’s first clean bill of health is pinned above the clinic bed.':''}</p><p>${allCrew().map(a=>escape(a.callsign||a.name)+': '+(a.bond>=2?'a share of the platform and people worth coming back for.':'a bunk, a wage, and another chance.')).join('<br>')}</p><p>Far below, another timetable starts printing. Ada turns the sound down. Tonight, the kettle is enough.</p><p class="amber">Main adventure complete. Arc blade unlocked. The world stays open; expeditions and unfinished work remain.</p><div class="row"><button data-action="close">STAY A WHILE</button><button data-action="journal">CREW LEDGER</button><button data-action="expeditions">PLAN AN EXPEDITION</button></div>`);}
function greaterJournal(){const g=S.greater;panel('CREW LEDGER / CARTOGRAPHY & COMBAT',`<nav class="loadout-tabs">${[['main','MAIN STORY'],['jobs','CONTRACTS'],['side','SIDE QUESTS'],['expeditions','EXPEDITIONS'],['completed','COMPLETED'],['crew','CREW / NOTES']].map(([id,n])=>`<button data-journal-tab="${id}" class="${id===journalTab?'primary':''}">${n}</button>`).join('')}<button data-action="ward">WARD DEVELOPMENT</button><button data-action="rumors">RUMORS / DISCOVERIES</button><button data-action="lifework">RESTORATION / RILL</button></nav>${journalTab==='main'?`<h1>The Common Line.</h1><p class="amber">${mainObjective()}</p><div class="grid">${UG.mainActs.map(([name,text],i)=>`<article class="card ${campaignAct()>i+1?'complete':''}"><div class="tag">ACT ${i+1} / ${campaignAct()>i+1?'COMPLETE':campaignAct()===i+1?'CURRENT':'AHEAD'}</div><h3>${name}</h3><p>${text}</p></article>`).join('')}</div><p>WARD TRUST ${g.factions.wards} · FACTOR TRUST ${g.factions.factors} · LOCAL STANDING ${S.reputation}</p><div class="row"><button data-action="trackmain">TRACK MAIN STORY</button><button data-action="charter">CHARTER / REQUIREMENTS</button><button data-action="expeditions">OPTIONAL EXPEDITIONS</button></div>`:['jobs','side'].includes(journalTab)?`<h1>${journalTab==='side'?'People worth coming back for.':'Work worth doing.'}</h1><p>Accept and settle at a physical work board. Completed jobs are on their own page.</p>${Object.entries(S.contracts).filter(([id,st])=>!st.done&&!!UG.contracts[id].side===(journalTab==='side')).map(([id])=>`<article class="card"><h3>${UG.contracts[id].name}</h3><p>${UG.contracts[id].text}</p><button data-track="${id}">TRACK CONTRACT</button></article>`).join('')||'<p>No accepted jobs. Work boards in Disintegration Ward, Rustmarket and Kettle Junction offer leads.</p>'}<button data-action="contracts">BROWSE WORK</button>`:journalTab==='expeditions'?`<h1>Beyond the timetable.</h1><p>${greaterObjective()||'Multi-area salvage trips. Bank freight early or open a deeper route. These use separate sites; story roads remain clear.'}</p><button data-action="expeditions">EXPEDITION BOARD</button>${Object.entries(UG.expeditions).map(([id,e])=>`<p>${e.name} / tier ${e.tier} / ${g.expeditionWins[id]||0} successful returns</p>`).join('')}`:journalTab==='completed'?`<h1>Paid accounts.</h1>${Object.entries(S.contracts).filter(([,st])=>st.done).map(([id,st])=>`<p><b>${escape(UG.contracts[id].name)}</b><br>${escape(st.outcome)}</p>`).join('')||'<p>No settled contracts yet.</p>'}${g.ending?'<p>The Common Line / ending: '+g.ending+'</p>':''}`:`<h1>Your people. Your record.</h1>${allCrew().map(a=>`<p>${escape(a.callsign||a.name)} / bond ${a.bond}/3${a.grudge?' / blood debt: '+escape(a.grudge.name):''}</p>`).join('')}<h2>Recent improvements</h2>${S.adventure.moments.slice(0,6).map(m=>`<p><b>${escape(m.title)}</b><br>${escape(m.body)}</p>`).join('')}<h2>Field notes</h2>${S.journal.map(t=>`<p>${escape(t)}</p>`).join('')}`}`);}

function expeditionFee(id){return Math.max(0,UG.expeditions[id].fee-((S.flags.rescueWorkshop||wardReady('freight'))?5:0));}

S.greater.run&&!S.adventure.run&&['hearth','market','junction','commons'].includes(S.room)&&!paths.size&&S.credits>=expeditionFee(id)?'':'disabled'}>DEPART →</button></article>`;}).join('')}</div><p>Paid returns diminish over five trips, including withdrawals; XP only on the first three trips. After five returns, all routes keep a modest successful-delivery payment of the entry fare plus ¢8 and one salvage, with no XP or repeat exceptional rewards; first-time patterns can still be recovered. Withdrawal without freight keeps half materials, no XP/patterns; a defeat keeps one quarter. Supplies and entry are spent.</p><button data-action="inventory">PREPARE CREW / COMPARE EQUIPMENT</button><button data-action="lifereport" ${S.greater.run?'':'disabled'}>ACTIVE TRIP / RISK & EXTRACTION</button><button data-action="activities">SHORT DISPATCH JOBS</button>`);}
function startExpedition(family){const e=UG.expeditions[family];if(!e||battle||paths.size||S.adventure.run||S.greater.run||!['hearth','market','junction','commons'].includes(S.room)||!(S.items[e.requires]||S.flags[e.requires])||S.credits<expeditionFee(family))return false;

 const spend=()=>{if(battle&&!canAct(selected(),1))return false;if(battle)selected().ap--;return true;};const index=+S.room.slice(-1);

 if(world().opened[o.id]){notify('Already recovered.');return true;}if(o.kind==='vault'&&enemies().length){notify('The deep reserve is guarded. Clear its patrols or use its stand-down order.');return true;}if(!spend())return true;world().opened[o.id]=true;
 if(o.kind==='primary'){r.primary=true;r.bag.xp+=30;r.bag.scrap+=6;notify('CONTRACTED FREIGHT SECURED // Extract now or risk the deep reserve.');}

/* Persistent Alpha 6 systems. Runtime animation never drives economic rewards. */
function wardUpgrade(d){
 if(!d.ward)d.ward={version:1,projects:{},rumors:{},recovered:[],events:{},machinery:0,cargo:[]};
 d.flags.wardAccess=true;d.journal=d.journal.map(t=>t.replaceAll('Last Light','Disintegration Ward').replaceAll('LAST LIGHT','DISINTEGRATION WARD'));return d;
}
function validateWard(d){const w=d.ward,own=(o,k)=>Object.hasOwn(o,k),bounded=n=>Number.isFinite(n)&&n>=0&&n<=1000000;
 if(!w||w.version!==1||!w.projects||!w.rumors||!w.events||!bounded(w.machinery)||!Array.isArray(w.recovered)||!Array.isArray(w.cargo))throw Error('Invalid Ward state.');
 for(const [id,p] of Object.entries(w.projects))if(!own(UG.wardProjects,id)||!p||!['building','ready'].includes(p.status)||!bounded(p.remaining)||p.remaining>8)throw Error('Invalid Ward project.');
 for(const [id,v] of Object.entries(w.rumors))if(!own(UG.relics,id)||!['heard','investigated','recovered'].includes(v))throw Error('Invalid rumor.');
 for(const [id,v] of Object.entries(w.events))if((!own(UG.wardEvents,id)&&id!=='serviceMachine')||v!==true)throw Error('Invalid optional event.');
 for(const a of [w.recovered,w.cargo])if(new Set(a).size!==a.length||a.some(id=>!own(UG.relics,id)))throw Error('Invalid relic manifest.');
 if(w.cargo.length&&!d.greater.run)throw Error('Relic freight without an expedition.');
 for(const id of w.recovered)if(!d[{weapon:'weapons',armorKey:'armors',gear:'gears',mod:'mods'}[UG.relics[id].kind]].includes(UG.relics[id].item))throw Error('Missing recovered relic.');
}
function wardReady(id){return S.ward.projects[id]?.status==='ready';}
function wardHere(id){const p=UG.wardProjects[id];return S.room==='hearth'&&inInteractionRange(selected(),p)&&!battle&&!paths.size;}
function wardReason(id){const p=UG.wardProjects[id];return S.ward.projects[id]?'Already commissioned.':p.requires&&!wardReady(p.requires)?'Requires '+UG.wardProjects[p.requires].name+'.':p.story&&!S.flags[p.story]?'Restore the relay with Mara first.':S.credits<p.credits||S.scrap<p.scrap?'Insufficient credits or salvage.':p.material&&S.ward.machinery<p.material?'Recover machinery on a successful Service Drains expedition or from the Sump hoist.':!wardHere(id)?'Visit the marked project in Disintegration Ward.':null;}

 * Visits, stock and unique choices are saved; animation and scenery are not. */
function lifeUpgrade(d) {
 if (!d.life) d.life={version:1,prototypes:{},components:{},visits:{},active:{},events:{},rescue:null,rescueSettled:false,deliveries:0,purchases:0,stock:d.ward.projects.freight?.status==='ready'?2:0};
 if(d.life.tracked===undefined)d.life.tracked=null;
 for (const id of Object.keys(UG.restorations)) if (d.weapons.includes(id)) d.life.prototypes[id]='restored';
 if(d.greater.run&&d.greater.run.assignment===undefined){d.greater.run.assignment=(d.greater.run.seed-1)%3;d.greater.run.sideDone=false;}
 if (d.ward.events.signal) d.life.components.mercy=true;
 return d;
}
function validateLife(d) {
 const l=d.life,record=o=>o&&typeof o==='object'&&!Array.isArray(o),count=n=>Number.isInteger(n)&&n>=0&&n<=1000000;
 if (!l||![null,'funeral','mercy'].includes(l.tracked)||l.version!==1||!['prototypes','components','visits','active','events'].every(k=>record(l[k]))||![null,'ward','road'].includes(l.rescue)||typeof l.rescueSettled!=='boolean'||![l.deliveries,l.purchases,l.stock].every(count)||l.stock>2) throw Error('Invalid adventurer life.');
 for (const [id,v] of Object.entries(l.prototypes)) if (!Object.hasOwn(UG.restorations,id)||!['frame','restored'].includes(v)||v==='restored'&&!d.weapons.includes(id)) throw Error('Invalid restored equipment.');
 for (const [id,v] of Object.entries(l.components)) if (!Object.hasOwn(UG.restorations,id)||v!==true) throw Error('Invalid restoration component.');
 for (const [id,v] of Object.entries(l.visits)) if (!UG.rooms[id]||!count(v)) throw Error('Invalid regional visits.');
 for (const [id,v] of Object.entries(l.active)) if (!UG.regionalEvents[v]||UG.regionalEvents[v].room!==id) throw Error('Invalid regional encounter.');
 for (const [id,v] of Object.entries(l.events)) if (!UG.regionalEvents[id]||!UG.regionalEvents[id].choices.some(c=>c[0]===v)) throw Error('Invalid regional outcome.');
 const run=d.greater.run;
 if (run?.assignment!==undefined&&(!Number.isInteger(run.assignment)||run.assignment<0||run.assignment>=UG.lifeOrders.length||typeof run.sideDone!=='boolean')) throw Error('Invalid expedition work order.');
}

 if (S.room==='hearth') for (const [id,n] of Object.entries(UG.residents)) {
  if (n.project&&!wardReady(n.project)||n.rescue&&S.life.rescue!=='ward') continue;
  r.objects.push(obj('resident-'+id,'life',n.x,n.y,n.name,{kind:'resident',resident:id,dynamic:true}));

  delete S.life.active[S.room];
  // Sparse, authored candidates. Never respawn story enemies or interrupt set pieces.
  const candidate=Object.entries(UG.regionalEvents).find(([id,e])=>e.room===S.room&&!S.life.events[id]&&
   (id==='camp'&&(S.life.prototypes.funeral==='frame'||S.greater.expeditionWins.service)||
    id==='patient'&&wardReady('infirmary')&&!enemies().length||
    id==='freight'&&wardReady('freight')&&!enemies().length||
    id==='survey'&&S.ward.events.lift));
  if (candidate&&(S.life.visits[S.room]%3!==0)) S.life.active[S.room]=candidate[0];
 }
 lifeObjects();

function atlasPlan(to,allowLocked=false) {

 while(queue.length){const id=queue.shift();if(id===to)break;for(const e of edges.filter(e=>e.from===id&&!e.frontier&&(allowLocked||e.open))){if(!prev.has(e.to)){prev.set(e.to,e);queue.push(e.to);}}}

  if(!allowLocked){const blocked=atlasPlan(to,true);if(blocked.path.length){const e=blocked.path.find(e=>!e.open);return {path:[],reason:'Blocked at '+UG.rooms[e.from].name+': '+(e.tram?'Restore Mara’s relay to power the trams.':UG.gates[e.object.gate]||'Required equipment or quest progress is missing.')};}}

 }

function platformHoles(p){return (p.apertures||[]).filter(h=>!h.flag||S?.flags[h.flag]);}
function solidSections(p){let sections=[{x:p.x,w:p.w}];for(const h of platformHoles(p)){const left=h.x-h.width/2,right=h.x+h.width/2;sections=sections.flatMap(s=>{const end=s.x+s.w;if(right<=s.x||left>=end)return [s];return [...(left>s.x?[{x:s.x,w:left-s.x}]:[]),...(right<end?[{x:right,w:end-right}]:[])];});}return sections;}
function deckSolidAt(p,x,margin=0){return solidSections(p).some(s=>x>=s.x+margin&&x<=s.x+s.w-margin);}
function activeLadders(){return room().ladders.filter(l=>!l.gate||S.flags[l.gate]);}
function physicalSupport(a){return room().platforms.find(p=>Math.abs(p.y-a.y)<9&&deckSolidAt(p,a.x));}
function routeFooting(a){return physicalSupport(a)||room().platforms.find(p=>Math.abs(p.y-a.y)<9&&a.x>=p.x&&a.x<=p.x+p.w&&activeLadders().some(l=>Math.abs(l.x-a.x)<8&&(l.top===p.y||l.bottom===p.y)));}
function solidRayBlocked(a,b){
 if(physicalWallBlocked(a,b))return true;
 if(Math.abs(a.y-b.y)<.001)return false;
 for(const p of room().platforms){const t=(p.y-a.y)/(b.y-a.y);if(t<=.015||t>=.985)continue;const x=a.x+(b.x-a.x)*t;if(deckSolidAt(p,x,3))return true;}return false;
}

 if(o.type==='ward'&&o.kind==='event'&&['courier','lift','dispute'].includes(o.event)){
  const id=o.event,e=UG.wardEvents[id],done=S.ward.events[id],crew=id==='courier'?fieldCrew('sable'):id==='lift'?fieldCrew('ilex')||fieldCrew('orren'):false;
  panel(e.name,`<p>${e.text}</p><p>${done?'Resolved / '+(S.open.choices[id]||'shared supplies'):id==='courier'?'Sable can stabilize the courier with her field rig, conserving a medkit.':id==='lift'?'Ilex or Orren can release the brake without sacrificing parts.':'Divide the salvage, or donate medicine and let the scavengers keep their stock.'}</p><div class="row">${openButton(id,'standard',id==='dispute'?'DIVIDE THE SALVAGE':id==='courier'?'USE 1 MEDKIT':'REPAIR / 3 SALVAGE',!!done||!!battle)}${id==='dispute'?openButton(id,'supply','DONATE 2 MEDKITS / +2 STANDING',!!done||!!battle):openButton(id,'crew','USE CREW FIELD SKILL',!!done||!crew||!!battle)}</div>`);return true;
 }
 if(o.type!=='open')return false;

  panel(c.name.toUpperCase()+' / '+c.role.toUpperCase(),`<h1>${id==='nim'?'There are people between the lines.':id==='brass'?'A promise has to cost something.':'Every name comes home.'}</h1><p>${c.desc}</p><p>${OPEN_ABILITIES[id]}</p><p>${id==='nim'?'“You opened that panel. Help me keep these routes public, and I’ll walk with you.”':id==='brass'?'“I need a crew the wards can trust. One point of local standing, a cleared Ashline, or ¢30 for the tenants I still owe.”':'A bruised worker sits beside a damaged harness. Close the steam valve, bring Sable, spend one medkit, or fit four salvage to the harness.'}</p>${openButton(id,id==='ilex'?'medkit':'join',id==='ilex'?'HELP / MEDIC, CLOSED VALVE OR 1 MEDKIT':'INVITE TO THE CREW',!!battle)}${id==='ilex'?openButton(id,'parts','FIT HARNESS / 4 SALVAGE',!!battle):''}<p>Four travel together; additional recruits wait at the shelter with their equipment.</p>`);return true;
 }
 if(o.kind==='checkpoint'){
  panel('ASHLINE / WHO PAID TWICE?',`<p>${S.open.choices.checkpoint?'The shift record is signed. Workers move freely now.':'The tenants say these ladders were already paid for. Fight through as before, present a stamped receipt with Brass or +2 standing, or post a public bond.'}</p><p>Negotiating during combat takes 2 AP. A stand-down grants no kill rewards. Either resolution completes the existing “No more tolls” clearance.</p>${openButton('checkpoint','evidence','PRESENT RECEIPT / BRASS OR +2 STANDING',!!S.open.choices.checkpoint)}${openButton('checkpoint','bond',enemies().length?'POST ¢45 BOND':'RECORD CLEARED PASSAGE',!!S.open.choices.checkpoint)}`);return true;
 }
 if(o.kind==='discovery'){
  const id=o.discovery;if(id==='freight'){const e=UG.wardEvents.lift;return openInteract({...o,type:'ward',kind:'event',event:'lift'});}

  if(id==='survey')body=`<p>Names have been pencilled on the paper copy. The terminal contains the same survey and can annotate the map if restored. Nim wants these people remembered.</p>${openButton(id,'paper','READ THE PAPER SURVEY',done||!!battle)}${openButton(id,'crew','ORREN / LATCH: RESTORE TERMINAL',done||!fieldCrew('orren')&&!fieldCrew('latch')||!!battle)}${openButton(id,'parts','RESTORE TERMINAL / 3 SALVAGE',done||!!battle)}`;
  if(id==='letter')body=`<p>“No freight tonight. Sit down anyway. There is enough for whoever finds the room.” A cup has left a clean circle in the dust.</p>${openButton(id,'inspect','REMEMBER THE NOTE',done||!!battle)}`;
  if(id==='receipt')body=`<p>PAID IN FULL / ASHLINE SHIFT LADDERS. The tenants kept a stamped duplicate under the kettle.</p>${openButton(id,'inspect','KEEP THE EVIDENCE',done||!!battle)}`;

  panel(o.name.toUpperCase(),`${done?'<p>This place is recorded in the crew’s journal.</p>':''}${body}`);return true;
 }return true;
}

document.addEventListener('click',e=>{const el=e.target.closest('[data-open-id]');if(!el||!S)return;const id=el.dataset.openId,method=el.dataset.openMethod;if(['workshop','survey','seal','receipt','letter'].includes(id))openDiscover(id,method);else openResolve(id,method);});

/* Alpha 10: authored industrial actions, readable enemies and procedural art. */
const INDUSTRIAL_TYPES=['pressurediver','shepherd','rivet','kiln','inspector'];
function industryUpgrade(d){if(!d.industry)d.industry={version:1,records:{},taken:{},air:null,power:null,feed:null};if(!d.world.walker)d.world.walker=emptyWorld(UG.rooms.walker);return d;}
function validateIndustry(d){const v=d.industry,record=x=>x&&typeof x==='object'&&!Array.isArray(x);if(!v||v.version!==1||!record(v.records)||!record(v.taken)||![null,'homes','purge'].includes(v.air)||![null,'homes','work'].includes(v.power)||![null,'homes','crew'].includes(v.feed))throw Error('Invalid industrial state.');for(const r of [v.records,v.taken]){if(Object.keys(r).length>40||Object.entries(r).some(([k,x])=>k.length>80||x!==true))throw Error('Invalid industrial discoveries.');}for(const w of Object.values(d.world))for(const e of Object.values(w.enemies)){if(e.industrialWindup!==undefined&&typeof e.industrialWindup!=='boolean'||e.industryExposed!==undefined&&typeof e.industryExposed!=='boolean')throw Error('Invalid industrial tell.');for(const k of ['markX','markY'])if(e[k]!==undefined&&(!Number.isFinite(e[k])||e[k]<0||e[k]>10000))throw Error('Invalid industrial target.');}}
function industryOffline(e){return S.room==='vents'&&S.industry.air==='homes'||S.room==='orchard'&&e.type==='shepherd'&&S.industry.power==='work';}
function industryTell(e){if(!INDUSTRIAL_TYPES.includes(e.type))return '';if(industryOffline(e))return 'SUPPLY ISOLATED / ordinary weapon only';if(e.industrialWindup)return e.type==='pressurediver'?'VENTING / armor -4 · pressure burst at marked floor':e.type==='rivet'?'FASTENER LOCK / slam at marked floor':e.type==='kiln'?'CARGO UNLATCHED / hot spill at marked floor':'LIVE TETHER / interrupt or isolate';return {pressurediver:'Pressure burst: one activation warning; move away or suppress.',rivet:'Rivet slam: marked location, one activation warning; destroys nearby cover.',kiln:'Hot cargo: one activation warning; moving away avoids the spill.',shepherd:'Recharges a nearby machine. Isolate its circuit or focus the shepherd.',inspector:'Surveying obsolete orders. Read and transmit a replacement spool for a stand-down.'}[e.type];}
function industryEnemy(e){if(!INDUSTRIAL_TYPES.includes(e.type))return false;const q=world().enemies[e.id];if(industryOffline(e)){q.industrialWindup=false;q.industryExposed=false;return false;}
 if(e.shocked||e.suppressed){q.industrialWindup=false;q.industryExposed=false;float(e,'PRESSURE INTERRUPTED','#8ed5cd');return false;}
 if(e.type==='inspector'){if(S.room==='orchard'&&S.industry.power==='homes'){float(e,'CURRENT PAID / SCANNING');return true;}return false;}
 if(e.type==='shepherd'){const patient=enemies().filter(t=>t.id!==e.id&&['pressurediver','kiln','inspector','drone'].includes(t.type)&&t.hp<t.maxhp&&dist(e,t)<580&&!solidRayBlocked({x:e.x,y:e.y-30},{x:t.x,y:t.y-30})).sort((a,b)=>a.hp/a.maxhp-b.hp/b.maxhp)[0];if(patient){world().enemies[patient.id].hp=Math.min(patient.maxhp,patient.hp+14);tracer(e,patient,'#ba9fdf');float(patient,'TETHER +14','#ba9fdf');return true;}return false;}
 if(e.shocked||e.suppressed){q.industrialWindup=false;q.industryExposed=false;float(e,'PRESSURE INTERRUPTED','#8ed5cd');return false;}
 const target=alive().filter(a=>shotInfo(e,a).legal&&dist(a,e)<520).sort((a,b)=>dist(a,e)-dist(b,e))[0];
 if(q.industrialWindup){q.industrialWindup=false;q.industryExposed=false;const center={x:q.markX,y:q.markY},radius=e.type==='rivet'?100:125,damage=e.type==='kiln'?28:e.type==='rivet'?32:26;
  for(const a of alive())if(dist(a,center)<radius&&!solidRayBlocked({x:center.x,y:center.y-25},{x:a.x,y:a.y-25}))hurt(a,Math.round(damage*(kitGear(a).windGuard?.5:1)),e);
  if(e.type==='rivet')for(const c of covers())if(dist(c,center)<radius)world().covers[c.id]=0;
  fx.push({type:'blast',x:center.x,y:center.y-20,r:radius,life:.45,max:.45,color:'#e7af73'});float(e,e.type==='kiln'?'CARGO SPILL':e.type==='rivet'?'FASTENER SLAM':'PRESSURE BURST','#e99677');checkBattle();return true;
 }
 if(!target)return false;q.industrialWindup=true;q.industryExposed=e.type==='pressurediver';q.markX=target.x;q.markY=target.y;float(e,'WARNING / '+(e.type==='kiln'?'CARGO RELEASE':e.type==='rivet'?'FASTENER LOCK':'VENTING / ARMOR OPEN'),'#edb86c');notify(e.name.toUpperCase()+' / marked floor will be hit next activation. Move out, suppress, shock or kill the attacker.');return true;
}
function industryReady(o){return o&&o.type==='industry'&&inInteractionRange(selected(),o)&&selected().hp>0&&!paths.has(selected().id)&&(!battle||battle.phase==='player'&&selected().ap>=1&&!paths.size);}
function industryEngineer(){return fieldCrew('orren')||fieldCrew('latch')||kitGear(selected()).fieldInterface;}
function industryResolve(id,method){const o=room().objects.find(o=>o.id===id);if(!industryReady(o)){notify('Reach this control with a ready fighter; combat operation requires 1 AP.');return false;}const st=S.industry;
 if(o.kind==='air'){
  if(method==='purge'){if(st.taken.purge||S.flags.ventAir)return false;st.taken.purge=true;st.air='purge';for(const a of [...alive(),...enemies()])if(a.x>850&&Math.abs(a.y-1200)<30)hurt(a,24,selected());log('The emergency purge clears the east work deck. Moth asks who will mend the bellows.');}
  else if(['crew','parts'].includes(method)){if(S.flags.ventAir)return false;if(method==='crew'&&!industryEngineer())return false;if(method==='parts'){if(S.scrap<4)return false;S.scrap-=4;}st.air='homes';S.flags.ventAir=true;log('The Cathedral feeds occupied ducts. A service ladder unfolds; pressure weapons lose their manifold supply.');}
  else return false;
 }else if(o.kind==='power'){
  if(!['homes','work'].includes(method)||st.power===method)return false;st.power=method;S.flags.orchardWork=method==='work';S.flags.orchardHomes=method==='homes';log(method==='work'?'Orchard current feeds the service hoist. The shepherd circuit is isolated.':'Orchard current feeds the occupied pods. Inspectors stop firing while the supply remains paid.');
 }else if(o.kind==='drive'){
  if(S.flags.walkerDrive||!['crew','parts'].includes(method))return false;if(method==='crew'&&!industryEngineer())return false;if(method==='parts'){if(S.scrap<4)return false;S.scrap-=4;}S.flags.walkerDrive=true;Object.assign(world().enemies['wk-reserve'],{hp:UG.enemyTypes.inspector.hp,rewarded:false,spared:false});log('The Foundry shifts its weight. The spine ladder opens, a reserve inspector wakes, and hot exhaust reaches the intake floor.');
 }else if(o.kind==='dump'){if(st.taken.dump)return false;st.taken.dump=true;explode(1570,1320,175,42);log('The cargo cradle discharges once. Its blast is dangerous to crew as well as carriers.');
 }else if(o.kind==='feed'){
  if(!S.flags.walkerDrive||st.feed||!['homes','crew'].includes(method))return false;st.feed=method;S.items.foundryFeed=true;if(method==='crew')reward({ammo:40,scrap:8});else{S.flags.industrialHomes=true;S.reputation+=2;}log(method==='crew'?'Auxiliary freight goes into the crew’s kit. The home duct remains dark.':'Warm air reaches Disintegration Ward. The supply exchange offers a permanent ten-percent discount.');
 }else if(o.kind==='record'){
  if(method==='standdown'&&o.record==='orders'){if(!st.records.orders)return false;const targets=enemies().filter(e=>e.type==='inspector');if(!targets.length)return false;for(const e of targets)Object.assign(world().enemies[e.id],{hp:0,spared:true,rewarded:true,industrialWindup:false});log('Replacement orders transmitted. The unfinished inspectors fold their tools and stand down.');}
  else{if(st.records[o.record])return false;st.records[o.record]=true;if(o.record==='choir')S.items.choirRoll=true;log(INDUSTRY_RECORDS[o.record]);}
 }else if(o.kind==='cache'){
  if(st.taken[o.cache]||enemies().length||!(o.cache==='baffle'?S.flags.ventAir:o.cache==='relaySpool'?st.power:S.flags.walkerDrive))return false;st.taken[o.cache]=true;unlock('gear',o.cache);log('Industrial discovery: '+UG.gear[o.cache].name+'. '+UG.gear[o.cache].desc);moment('RECOVERED / '+UG.gear[o.cache].name,UG.gear[o.cache].desc,'EQUIP','inventory');
 }else if(o.kind==='worker'){
  if(!S.flags.industrialHomes||st.taken.workerAid)return false;st.taken.workerAid=true;S.meds+=2;log('Moth delivers two clean field dressings from the newly ventilated rooms.');
 }else return false;
 if(battle)selected().ap=Math.max(0,selected().ap-1);close();checkBattle();hud();save(true);notify(o.kind==='drive'?'STRIDE DRIVE / shortcut open · inspector awake · hot exhaust at intake x1000–1280':o.kind==='cache'?'RECOVERED / '+UG.gear[o.cache].name:o.kind==='record'?'SHIFT RECORD / added to the journal':'MACHINERY / '+o.name+' · state saved after encounter');return true;
}
const INDUSTRY_RECORDS={discipline:'Disciplinary docket: each broken fastener was charged against a worker’s wages. The rivet rig was issued as repayment equipment. Nobody recorded a final payment.',tether:'Service wages: the shepherd’s machines earned the operator a fraction of every repair. The operator kept them running after wages stopped. Their tether reels are wrapped with names, not serial numbers.',cargo:'Undelivered load: the kiln carrier has brought the same crucible to a sealed foreman’s office for forty years. Each rejected delivery is logged as a new shift. Its hot cargo hatch still opens on the occupied-floor schedule.',choir:'Ninth shift roll: eight names, nine pressure suits. The ninth diver has been relieving a worker who died before the last evacuation. Latch recognizes the unclosed maintenance order.',orders:'Inspection spool: FLOOR EMPTY / EVACUATE OCCUPANTS. Both orders were stamped by the same foreman. A corrected spool can make unfinished inspectors stand down.',boot:'A retrieval boot is bolted to the floor beside a chalk line: THIS IS WHERE THE MACHINE TOOK ITS LAST STEP. Inside the boot, someone planted a paper flower.'};
function industryButton(o,method,label,disabled=false){return `<button data-industry="${o.id}" data-industry-method="${method}" ${disabled?'disabled':''}>${label}</button>`;}
function industryInteract(o){if(o.type!=='industry')return false;const st=S.industry;let body='';
 if(o.kind==='air')body=`<p>The manifold feeds pressure weapons and the occupied ducts. Repairing its home circuit isolates the weapons and unfolds a service ladder. An emergency purge instead hits everyone on the east 1200 deck for 24 damage, once.</p><p>Home supply: ${S.flags.ventAir?'RESTORED':'DISCONNECTED'}</p>${industryButton(o,'crew','ORREN / LATCH / RELAY INTERFACE: REPAIR',!industryEngineer()||!!S.flags.ventAir)}${industryButton(o,'parts','REPAIR HOME CIRCUIT / 4 SALVAGE',!!S.flags.ventAir)}${industryButton(o,'purge','EMERGENCY PURGE / FRIENDLY FIRE',!!st.taken.purge||!!S.flags.ventAir)}`;
 if(o.kind==='power')body=`<p>Occupied pods and the service hoist share one feeder. Homes pause inspector attacks. Work opens the direct 420–880 ladder and disables shepherd recharging. You can change allocation later.</p><p>Current allocation: ${st.power||'UNASSIGNED'}</p>${industryButton(o,'homes','FEED OCCUPIED PODS',st.power==='homes')}${industryButton(o,'work','FEED SERVICE HOIST',st.power==='work')}`;

 if(o.kind==='record')body=`<p>${INDUSTRY_RECORDS[o.record]}</p>${industryButton(o,'read','RECORD IN JOURNAL',!!st.records[o.record])}${o.record==='orders'?industryButton(o,'standdown','TRANSMIT CORRECTED ORDER / INSPECTORS STAND DOWN',!st.records.orders):''}`;
 if(o.kind==='cache')body=`<p>${UG.gear[o.cache].name}: ${UG.gear[o.cache].desc}</p><p>Clear the district and restore its ${o.cache==='baffle'?'home air circuit':o.cache==='relaySpool'?'root exchange':'stride drive'} to release the maintenance lock.</p>${industryButton(o,'recover',st.taken[o.cache]?'ALREADY RECOVERED':'RECOVER FIELD PATTERN',!!st.taken[o.cache])}`;
 if(o.kind==='worker')body=`<p>${S.room==='vents'?'Moth stitches leather bellows beneath a ceiling of iron ribs. “That ninth suit? We stopped sending someone to collect it. It kept coming back.”':'Hess has bolted a boot to the retrieval deck. “If she takes another step, remember which side your people are standing on.”'}</p><p>${S.flags.industrialHomes?'The Ward’s new air intake is working. Moth has sent clean dressings.':'A restored auxiliary home feed would make a difference in the Ward.'}</p>${industryButton(o,'service','COLLECT HOME DELIVERY / 2 MEDKITS',!S.flags.industrialHomes||!!st.taken.workerAid)}`;
 panel(o.name.toUpperCase(),body+'<p>Combat controls and discoveries cost 1 AP. Read the effect before committing; crew roles offer alternatives to parts.</p>');return true;

function industryTick(dt){if(!battle&&industryHazard(selected()))selected().hp=Math.max(1,selected().hp-3*dt);if(modal||battle)return;if(S.room==='vents'&&S.industry.records.choir)openSay('latch-ninth','latch','Nine suits. Eight names. I will close the order myself.');if(S.room==='walker'&&S.flags.walkerDrive)openSay('ilex-stride','ilex','A moving machine is a route and a threat. Both can be useful.');if(S.room==='orchard'&&S.industry.power)openSay('nim-orchard','nim','Mark which branches are live. A map should not electrocute its reader.');}

function industryEllipse(x,y,rx,ry,c,fill=null){ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);if(fill){ctx.fillStyle=fill;ctx.fill();}ctx.strokeStyle=c;ctx.lineWidth=2;ctx.stroke();}
function industryCog(x,y,r,c,phase=0){industryEllipse(x,y,r,r,c,'#151b1c');industryEllipse(x,y,r*.7,r*.7,c);industryEllipse(x,y,r*.17,r*.17,c);for(let i=0;i<20;i++){const a=i*Math.PI/10+phase;line(x+Math.cos(a)*r*.81,y+Math.sin(a)*r*.81,x+Math.cos(a)*r*1.08,y+Math.sin(a)*r*1.08,c,Math.max(2,r*.07));}for(let i=0;i<5;i++){const a=i*Math.PI*.4+phase;line(x+Math.cos(a)*r*.2,y+Math.sin(a)*r*.2,x+Math.cos(a)*r*.66,y+Math.sin(a)*r*.66,c,3);}}
function industryScenery(){
 if(!['vents','orchard','walker'].includes(S.room))return;
 const col=S.room==='orchard'?'#756386':S.room==='vents'?'#786346':'#785454';
