const weapon=a=>combatWeapon(a);

const covers=()=>room().covers.filter(c=>(world().covers[c.id]??c.hp)>0);

function fresh(){const worlds={};for(const [id,r] of Object.entries(UG.rooms))worlds[id]={enemies:Object.fromEntries(r.enemies.map(e=>[e.id,{hp:UG.enemyTypes[e.type].hp,x:e.x,y:e.y}])),opened:{},covers:{}};

// Find a shortest walk/ladder route through the actual platform graph.
function route(a,tx,ty){const ps=room().platforms, start=floorAt(a), end=ps.find(p=>Math.abs(p.y-ty)<12&&tx>=p.x&&tx<=p.x+p.w);if(!start||!end)return null;

 const costs=nodes.map(()=>Infinity),prev=[],done=new Set();costs[0]=0;
 for(let n=0;n<nodes.length;n++){let i=-1;for(let k=0;k<nodes.length;k++)if(!done.has(k)&&(i<0||costs[k]<costs[i]))i=k;if(i<0||costs[i]===Infinity)break;if(i===1)break;done.add(i);for(let j=0;j<nodes.length;j++){if(j===i)continue;const same=nodes[i].p===nodes[j].p,linked=edges.some(([a,b])=>(a===i&&b===j)||(a===j&&b===i));if(!same&&!linked)continue;const v=costs[i]+dist(nodes[i],nodes[j]);if(v<costs[j]){costs[j]=v;prev[j]=i;}}}
 if(!Number.isFinite(costs[1]))return null;let out=[],i=1;while(i!==0){out.unshift({x:nodes[i].x,y:nodes[i].y});i=prev[i];}return {points:out,length:costs[1]};
}

function journal(){panel('CREW LEDGER / OPEN ACCOUNTS',`<h1>Keep your people breathing.</h1><p class="amber">${escape(objective())}</p><button class="primary" data-action="contracts">JOBS & CONTRACTS →</button><div class="grid"><div class="card"><h3>LAST LIGHT / FIRST JOB</h3><p>${S.flags.power?'✓':'○'} Restore settlement power<br>${S.items.rig?'✓':'○'} Recover the climbing rig<br>${S.flags.signal?'✓':'○'} Recover freight routing codes<br>${S.ending?'✓':'○'} Take the Bell Engine charter</p></div><div class="card"><h3>YOUR CREW</h3>${actors().map(a=>`<p>${escape(a.callsign||a.name)} / bond ${a.bond}/3<br>${a.grudge?'Grudge: '+escape(a.grudge.name)+' in '+UG.rooms[a.grudge.room].name:'No open blood debts.'}</p>`).join('')}</div></div><h2>Expedition record</h2>${S.journal.map(t=>`<p>— ${escape(t)}</p>`).join('')}`);}
function map(){const links=UG.roomConnections();panel('WARD ATLAS / FREIGHT NETWORK',`<p>${S.visited.length}/${Object.keys(UG.rooms).length} districts surveyed. A locked hatch is a reason to come back. Trains link discovered stations once Last Light has power.</p><div class="map-layout">${Object.entries(UG.rooms).map(([id,r])=>`<div class="map-room ${S.room===id?'current':''}">${S.visited.includes(id)?r.name:'UNSURVEYED'}<small>${S.visited.includes(id)?r.depth+' M / '+(r.enemies.length&&!Object.values(S.world[id].enemies).some(e=>e.hp>0)?'SECURED':'ACTIVE'):'UNKNOWN DEPTH'}${S.room===id?' / YOUR CREW':''}</small></div>`).join('')}</div><h2>Known routes from ${room().name}</h2>${links.filter(l=>l.from===S.room).map(l=>`<p>↔ ${UG.rooms[l.to].name}${l.gate&&!S.items[l.gate]&&!S.flags[l.gate]?' / LOCKED: '+UG.gates[l.gate]:''}</p>`).join('')}<button data-action="retreat" ${battle?'':'disabled'}>RETREAT TO LAST LIGHT (near encounter entry)</button>`);}
function inventory(){const a=selected(),w=weapon(a);panel('CREW / YOUR KIND OF FIGHTER',`<div class="row">${actors().map((p,i)=>`<button data-equipselect="${i}" class="${active===i?'primary':''}">${escape(p.callsign||p.name)} / ${battle?p.ap+' AP':Math.ceil(p.hp)+' HP'}</button>`).join('')}</div><h1>${escape(a.callsign||a.name)}</h1><p>${a.role} · LV ${S.level} · ${Math.ceil(a.hp)}/${a.maxhp} HP · Armor ${armorSave(a)} · Movement ${moveAllowance(a)}/AP · Bond ${a.bond}/3<br>¢${S.credits} · ${S.scrap} salvage · ${S.ammo} rounds · ${S.meds} medkits · ${S.grenades} frags</p><div class="row"><label>CALLSIGN <input id="callsign" maxlength="18" value="${escape(a.callsign||a.name)}" ${battle?'disabled':''}></label><button data-custom="name" ${battle?'disabled':''}>SET NAME</button>${Object.entries(UG.dyes).map(([id,c])=>`<button data-dye="${id}" aria-label="${id} armor color" style="color:${c}" ${battle?'disabled':''}>●</button>`).join('')}</div><p>Equipment is a collection of unlocked patterns: each fighter can use any owned pattern. Weapons share spare ammunition. Switching guns conserves rounds. Equip and customize outside combat.</p><h2>Weapon / ${w.name}</h2><div class="grid">${S.weapons.map(id=>{const v=UG.weapons[id];return `<article class="card"><div class="tag">${v.ap} AP / ${v.melee?'MELEE':v.mag+' ROUNDS'}</div><h3>${v.name}</h3><p>${v.desc}<br>Base damage ${v.damage} · Range ${v.range} · Pen ${v.pen}</p><button data-equip="${id}" ${battle||a.weapon===id?'disabled':''}>${a.weapon===id?'EQUIPPED':'EQUIP →'}</button></article>`;}).join('')}</div>${kitSection('armorKey','Armor',S.armors,UG.armors,a)}${kitSection('gear','Field gear',S.gears,UG.gear,a)}${kitSection('mod','Weapon modification',S.mods,UG.mods,a)}<h2>Talents / ${a.points} unspent</h2><button data-respec="true" ${battle||S.scrap<8||!Object.values(a.talents).some(n=>n>0)?'disabled':''}>RETRAIN / 8 SALVAGE</button><div class="grid">${Object.entries(UG.talents).map(([id,t])=>`<article class="card"><h3>${t.name} / ${a.talents[id]} of ${t.max}</h3><p>${t.desc}</p><button data-talent="${id}" ${battle||a.points<1||a.talents[id]>=t.max?'disabled':''}>SPEND 1 POINT</button></article>`).join('')}</div><h2>Kit in action</h2><p>Effective damage ${w.damage} · Accuracy ${w.acc} · Penetration ${w.pen}<br>${a.bond?'Bond bonus: +'+(a.bond*2)+' accuracy.':''} ${a.grudge?'Blood debt: +5 damage against '+escape(a.grudge.name)+'.':''}</p><h2>Key salvage</h2><p>${Object.keys(S.items).filter(k=>S.items[k]).map(k=>escape(itemName(k))).join(' · ')||'Nothing yet.'}</p><button data-action="workbench">PATTERNS & WORKBENCH →</button>`);}
function kitSection(slot,title,owned,defs,a){return `<h2>${title}</h2><div class="grid">${owned.map(id=>`<article class="card"><h3>${defs[id].name}</h3><p>${defs[id].desc}</p><button data-kit="${slot}:${id}" ${battle||a[slot]===id?'disabled':''}>${a[slot]===id?'EQUIPPED':'EQUIP →'}</button></article>`).join('')}</div>`;}
const recipes=[['armorKey','mesh',14],['armorKey','plate',24],['armorKey','ceramic',22],['gear','targeter',14],['gear','respirator',12],['gear','climbrig',16],['gear','medrig',18],['gear','shockground',16],['gear','salvager',12],['mod','sighted',12],['mod','hot',16],['mod','piercer',18],['weapon','handcannon',22],['weapon','chainblade',25],['weapon','arc',32]];
function workbench(){panel('WORKBENCH / MAKE IT YOURS',`<h1>Built to survive.</h1><p>${S.scrap} SALVAGE. Recover salvage from chests, toll safes, jobs and victories. Each recipe unlocks a permanent pattern; use PACK to equip it on individual fighters. Field crafting is available outside combat.</p><div class="grid">${recipes.map(([kind,id,cost])=>{const defs={armorKey:UG.armors,gear:UG.gear,mod:UG.mods,weapon:UG.weapons}[kind],list={armorKey:S.armors,gear:S.gears,mod:S.mods,weapon:S.weapons}[kind];return `<article class="card"><div class="tag">${kind.toUpperCase()} / ${cost} SALVAGE</div><h3>${defs[id].name}</h3><p>${defs[id].desc}</p><button data-craft="${kind}:${id}" ${battle||S.scrap<cost||list.includes(id)?'disabled':''}>${list.includes(id)?'PATTERN OWNED':'FABRICATE →'}</button></article>`;}).join('')}</div><div class="row"><button data-action="inventory">BACK TO CREW</button></div>`);}
function serviceKitAction(el){if(!S)return false;
 if(el.dataset.respec){if(!battle&&S.scrap>=8){let a=selected(),spent=Object.values(a.talents).reduce((n,v)=>n+v,0);if(spent){S.scrap-=8;a.points+=spent;for(const k of Object.keys(a.talents))a.talents[k]=0;inventory();save(true);}}return true;}
 if(el.dataset.kit){if(battle)return true;const [slot,id]=el.dataset.kit.split(':'),defs={armorKey:UG.armors,gear:UG.gear,mod:UG.mods}[slot],owned={armorKey:S.armors,gear:S.gears,mod:S.mods}[slot];if(defs&&owned.includes(id)){selected()[slot]=id;inventory();save(true);hud();}return true;}
 if(el.dataset.talent){if(battle)return true;let a=selected(),id=el.dataset.talent;if(UG.talents[id]&&a.points>0&&a.talents[id]<UG.talents[id].max){a.points--;a.talents[id]++;inventory();save(true);}return true;}
 if(el.dataset.craft){if(battle)return true;const [kind,id]=el.dataset.craft.split(':'),r=recipes.find(r=>r[0]===kind&&r[1]===id),owned={armorKey:S.armors,gear:S.gears,mod:S.mods,weapon:S.weapons}[kind];if(r&&S.scrap>=r[2]&&!owned.includes(id)){S.scrap-=r[2];unlock(kind,id);log('Fabricated '+id+' pattern.');save(true);workbench();}return true;}
 if(el.dataset.dye){if(!battle&&UG.dyes[el.dataset.dye]){selected().dye=el.dataset.dye;selected().color=UG.dyes[el.dataset.dye];inventory();save(true);}return true;}
 if(el.dataset.custom){if(!battle){let name=$('#callsign').value.trim().slice(0,18);if(name){selected().callsign=name;inventory();hud();save(true);}}return true;}
 return false;
}
function expansionInteract(o){
 if(o.type==='contracts'){contractBoard();return true;}
 if(o.type==='workbench'){workbench();return true;}
 if(o.type==='salvage'){if(!world().opened[o.id]){world().opened[o.id]=true;S.scrap+=15;S.credits+=30;notify('TOLL SAFE // +15 salvage / +30 credits.');save(true);}else notify('Already stripped clean.');return true;}
 if(o.type==='rescue'){if(enemies().length){notify('Nix: Clear the collectors first. I’m not running past that saw.');return true;}if(!S.items.nix){S.items.nix=true;gainXP(30);log('Nix rescued from the Foundry.');save(true);}panel('NIX / UNFINISHED BUSINESS',`<p>“Orren told me never to work for free. Then he left me here doing it.”</p><p>The apprentice limps toward the freight road. Settle the job at a work board to decide where they go.</p>`);return true;}
 if(o.type==='vehicle'){
 if(S.room==='convoy'){if(enemies().length){notify('The ambushers still control the train.');return true;}if(!S.items.convoyReceipt){S.items.convoyReceipt=true;S.flags.convoy=true;gainXP(65);S.scrap+=12;log('Locomotive 09 delivered. The crew has a freight charter.');}travel('yard',1590,880);notify('FREIGHT DELIVERED // Take the receipt to Switch’s board for payment.');return true;}
 if(!S.flags.railPass){notify('Axle, diesel, regulator. Take A living on the rails at a work board.');return true;}
 if(S.items.convoyReceipt){panel('LOCOMOTIVE 09 / CHARTERED',`<p>The crew’s locomotive is earning its keep. Use the powered rail terminals to visit discovered stations.</p><button data-action="contracts">CHECK PAID WORK</button>`);return true;}
 panel('LOCOMOTIVE 09 / THE ROLLING MILE',`<h1>First run. Live cargo.</h1><p>A convoy ambush ahead. Pack ammunition, medical supplies and your crew. The brake van allows a retreat; the cab completes the run after the attackers are defeated.</p><button class="primary" data-action="boardtrain">BOARD THE FREIGHT →</button>`);return true;
 }
 if(o.type==='convoyExit'){travel('yard',1510,880);notify('Freight run abandoned. Enemy wounds persist.');return true;}
 return o.type==='chemical';
}
function expansionAction(id){if(id==='next'){cycleCrew();return true;}if(id==='contracts'){if(battle){notify('Finish the encounter before settling work.');return true;}contractBoard();return true;}if(id==='workbench'){if(battle){notify('No crafting during combat.');return true;}workbench();return true;}if(id==='boardtrain'){if(!battle&&S.flags.railPass&&!S.items.convoyReceipt)travel('convoy',100,880);return true;}return false;}
function activationStatus(a){if(a.hp<=0)return;const gear=a.enemy?{}:kitGear(a),armor=a.enemy?{}:kitArmor(a);if(a.toxin&&!gear.toxin)hurt(a,a.toxin);if(a.burn&&!armor.fire)hurt(a,a.burn);a.toxin=0;a.burn=0;if(a.enemy)Object.assign(world().enemies[a.id],{toxin:0,burn:0});}
function statusHit(a,t,w){const gear=t.enemy?{}:kitGear(t),armor=t.enemy?{}:kitArmor(t);if(w.toxin&&!gear.toxin)t.toxin=w.toxin;if(w.burn&&!armor.fire)t.burn=w.burn;if(w.shock&&!gear.shock)t.shocked=true;if(w.suppress)t.suppressed=true;if(t.enemy)Object.assign(world().enemies[t.id],{toxin:t.toxin||0,burn:t.burn||0,shocked:!!t.shocked,suppressed:!!t.suppressed});}
function enemySpecial(e){activationStatus(e);if(e.hp<=0){checkBattle();return true;}if((e.suppressed?1:0)+(e.shocked?1:0)>=2)return false;
 if(e.role==='medic'){const injured=enemies().filter(t=>t.id!==e.id&&dist(e,t)<500&&t.hp<t.maxhp).sort((a,b)=>a.hp/a.maxhp-b.hp/b.maxhp)[0];if(injured){world().enemies[injured.id].hp=Math.min(injured.maxhp,injured.hp+18);float(injured,'PATCHED +18','#8ed5cd');return true;}}
 if(e.role==='bomber'&&alive().some(a=>dist(a,e)<150)){world().enemies[e.id].hp=0;explode(e.x,e.y,175,32);notify('DEMOLITION RUNNER // Chain blast!');return true;}return false;
}
function afterVictory(){const salvage=5+actors().reduce((n,a)=>n+(kitGear(a).salvage||0),0);S.scrap+=salvage;for(const a of actors()){a.bondXP++;if(a.bondXP>=3){a.bondXP=0;a.bond=Math.min(3,a.bond+1);}if(a.grudge&&a.grudge.room===S.room&&!world().enemies[a.grudge.enemy]?.hp){log((a.callsign||a.name)+' settled a blood debt.');a.grudge=null;}}world().cleared=true;return salvage;}
function surviveTick(dt){if(S.room==='garden'&&Math.abs(selected().x-810)<60&&selected().y>840&&!kitGear(selected()).toxin){selected().hp=Math.max(1,selected().hp-6*dt);if(Math.floor(clock)!==Math.floor(clock-dt))notify('CHEMICAL SEEP // Equip a respirator or use the high route.');}}
function expansionScenery(){const theme=room().theme,col=room().color;
 if(['rail','convoy'].includes(theme)){for(let y of [900,917])line(0,y,1900,y,'#6e7350',3);for(let x=0;x<1900;x+=45)rect(x,895,7,32,'#4c5135');const offset=theme==='convoy'?(clock*120)%220:0;for(let i=0;i<9;i++){const x=i*240-offset;line(x,280,x+80,280,'#6e7650');line(x+40,280,x+40,340,'#6e7650');}if(theme==='convoy')text('FREIGHT 09 // KEEP MOVING',670,360,col,20);}
 if(theme==='lift'){for(const x of [710,1130]){line(x,100,x,880,'#8e9668',4);for(let y=140;y<860;y+=40)line(x-7,y,x+7,y,'#5e6f43');}rect(720,750,380,55,'#253020');outline(720,750,380,55,col);text('COUNTERWEIGHT / UNION PROPERTY',910,784,col,12,'center');}
 if(S.room==='docks'){for(const x of [650,1300]){rect(x,230,16,650,'#283d39');line(x,230,x+300,230,'#70908a',5);line(x,230,x+150,130,'#70908a',3);line(x+150,130,x+300,230,'#70908a',2);const sway=Math.sin(clock*.7)*6;line(x+250+sway,230,x+250+sway,570,'#7b9f90',2);outline(x+220+sway,570,60,45,col);}}
 if(S.room==='garden'){for(let x=500;x<1700;x+=120){line(x,880,x,830,'#5c8562',2);ctx.beginPath();ctx.ellipse(x,830,30,10,0,Math.PI,Math.PI*2);ctx.strokeStyle='#8db68b';ctx.stroke();}}
 for(const o of room().objects){if(o.type==='vehicle'){const x=o.x,y=o.y;rect(x-120,y-95,210,65,'#243321');outline(x-120,y-95,210,65,col);rect(x+20,y-135,70,40,'#1b291e');outline(x+20,y-135,70,40,col);rect(x+32,y-122,40,16,'#86a76d');for(let n=-90;n<90;n+=50){ctx.beginPath();ctx.arc(x+n,y-18,18,0,Math.PI*2);ctx.strokeStyle=col;ctx.stroke();}text('09',x-40,y-56,col,22);}}
}
// One delegated handler for expansion menus; disabled buttons are inert natively.
document.addEventListener('click',e=>{const el=e.target.closest('[data-contract],[data-resolution],[data-kit],[data-talent],[data-craft],[data-dye],[data-custom],[data-sortie],[data-track],[data-respec]');if(!el||!S)return;if(serviceKitAction(el))return;
 if(el.dataset.track&&S.contracts[el.dataset.track]&&!S.contracts[el.dataset.track].done){S.tracked=el.dataset.track;save(true);notify('Tracking: '+UG.contracts[S.tracked].name);hud();}
 if(el.dataset.contract)settleContract(el.dataset.contract);
 if(el.dataset.resolution){const [id,ch]=el.dataset.resolution.split(':');settleContract(id,ch);}
 if(el.dataset.sortie){const id=el.dataset.sortie;if(battle||!S.flags.convoy||!['yard','slag','garden'].includes(id)||(S.sorties[id]||0)>=3||Object.values(S.world[id].enemies).some(e=>e.hp>0))return;S.sorties[id]=(S.sorties[id]||0)+1;for(const e of UG.rooms[id].enemies)S.world[id].enemies[e.id]={hp:UG.enemyTypes[e.type].hp,x:e.x,y:e.y};S.world[id].cleared=false;travel(id,100,880);notify('SALVAGE CONTRACT // Work site repopulated. Keep what you can carry.');}
});

function validateExpansion(d){
 const own=(defs,id)=>typeof id==='string'&&Object.hasOwn(defs,id),num=n=>Number.isFinite(n)&&n>=0&&n<=1000000;
 if(d.tracked!=null&&!own(UG.contracts,d.tracked))throw Error('Invalid tracked job.');
 if(d.expansion!==1||!num(d.scrap)||!Number.isFinite(d.reputation)||Math.abs(d.reputation)>10000||!d.contracts||!d.sorties)throw Error('Invalid campaign state.');
 for(const [key,defs] of [['armors',UG.armors],['gears',UG.gear],['mods',UG.mods]])if(!Array.isArray(d[key])||!d[key].every(id=>own(defs,id)))throw Error('Invalid equipment collection.');
 for(const a of d.party){for(const k of ['burn','toxin'])if(a[k]!==undefined&&(!Number.isFinite(a[k])||a[k]<0||a[k]>100))throw Error('Invalid status.');if(!own(UG.armors,a.armorKey)||!d.armors.includes(a.armorKey)||!own(UG.gear,a.gear)||!d.gears.includes(a.gear)||!own(UG.mods,a.mod)||!d.mods.includes(a.mod)||!own(UG.dyes,a.dye)||typeof a.callsign!=='string'||a.callsign.length>18||!num(a.points)||!num(a.bondXP)||!Number.isInteger(a.bond)||a.bond<0||a.bond>3||!a.talents)throw Error('Invalid crew customization.');for(const [id,t] of Object.entries(UG.talents))if(!Number.isInteger(a.talents[id])||a.talents[id]<0||a.talents[id]>t.max)throw Error('Invalid talent.');if(a.grudge&&(!own(UG.rooms,a.grudge.room)||!UG.rooms[a.grudge.room].enemies.some(e=>e.id===a.grudge.enemy)||typeof a.grudge.name!=='string'))throw Error('Invalid blood debt.');a.color=UG.dyes[a.dye];}
 for(const [id,q] of Object.entries(d.contracts)){if(!own(UG.contracts,id)||!q||typeof q.accepted!=='boolean'||(q.done&&typeof q.outcome!=='string'))throw Error('Invalid contract.');}
 for(const [id,n] of Object.entries(d.sorties))if(!['yard','slag','garden'].includes(id)||!Number.isInteger(n)||n<0||n>3)throw Error('Invalid salvage run.');
}

function drawWeaponFx(f){
 const w=UG.weapons[f.style]||UG.weapons.pistol;
 if(w.melee){line(f.tx-20,f.ty+20,f.tx+18,f.ty-20,f.color,3);return;}
 if(f.style==='arc'){let prev={x:f.x,y:f.y};for(let i=1;i<=7;i++){const n={x:f.x+(f.tx-f.x)*i/7,y:f.y+(f.ty-f.y)*i/7+(i<7?(i%2?8:-8):0)};line(prev.x,prev.y,n.x,n.y,'#8ed5cd',2);prev=n;}return;}
 if(w.burn){ctx.fillStyle='#e7af7344';ctx.beginPath();ctx.moveTo(f.x,f.y);ctx.lineTo(f.tx,f.ty-20);ctx.lineTo(f.tx,f.ty+20);ctx.closePath();ctx.fill();}
 const color=f.style==='laser'?'#a5e9db':f.style==='plasma'?'#b8b0e4':f.color;
 line(f.x,f.y,f.tx,f.ty,color,w.ap===2?3:2);if(w.burst)line(f.x,f.y+4,f.tx,f.ty+4,color,1);
}

title();requestAnimationFrame(frame);
})();
</script></body></html>
